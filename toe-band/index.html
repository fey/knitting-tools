<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор ленточного мыска носка</title>
    <meta name="description" content="По начальным и конечным петлям, кромке и ритму убавок — схема мыска, число рядов и счёт связанных рядов. Ссылка несёт сам расчёт." />

    <!-- Карточка для соцсетей (§11). Адреса абсолютные: относительный путь не подхватит
         ни один сборщик превью, он читает страницу вне её origin. Картинка одна на обе
         страницы, снимается `make og`. Размеры объявлены теми, что на файле. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Калькуляторы для вязания" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Калькулятор ленточного мыска носка" />
    <meta property="og:description" content="По начальным и конечным петлям, кромке и ритму убавок — схема мыска, число рядов и счёт связанных рядов. Ссылка несёт сам расчёт." />
    <meta property="og:url" content="https://fey.github.io/knitting-tools/toe-band/" />
    <meta property="og:image" content="https://fey.github.io/knitting-tools/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="670" />
    <meta property="og:image:alt" content="Схема ленточного мыска носка: клетки убавок сходятся треугольником к закрытию" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pages/toe-band.ts"></script>
  </body>
</html>
