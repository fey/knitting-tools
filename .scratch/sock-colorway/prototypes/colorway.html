<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОТОТИП — конструктор расцветки носка</title>
<!--
  ПРОТОТИП. Одноразовый код, в main не мержится, живёт на ветке prototype/sock-colorway.
  Предыдущая итерация (общий раппорт, режимы «однотон / в полоску», три варианта экрана) —
  коммит bae124e на той же ветке.

  Модель этой итерации (решения мастера 2026-11-19):
    - участок — последовательность полос из цветов палитры, полосы идут один раз;
      однотон — участок из одной полосы; общего раппорта и правил нет;
    - тапа по носку нет: носок — картинка, правят в дереве участков под ним;
    - новая полоса встаёт в конец и пропорционально забирает ряды у предыдущих;
    - генерация режет незакрытые участки на 1–4 полосы.
  Вид «Носок / Развёртка» переключается над картинкой. Хранения нет: всё в памяти.
-->
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<style>
  :root { --ink:#0f172a; --mute:#64748b; --line:#cbd5e1; --bg:#fff; --soft:#f1f5f9; --acc:#0f766e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:0; }
  button, select, input { font:inherit; color:inherit; }
  button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; min-height:40px; cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.ghost { border-color:transparent; background:transparent; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input[type=number] { width:60px; padding:6px; border:1px solid var(--line); border-radius:6px; }
  input.hex { width:84px; padding:6px; border:1px solid var(--line); border-radius:6px; font-family:ui-monospace,monospace; }
  input[type=color] { width:40px; height:40px; padding:0; border:1px solid var(--line); border-radius:8px; background:none; }
  .page { max-width:1100px; margin:0 auto; padding:12px 16px 120px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .mute { color:var(--mute); font-size:13px; }
  .sw { display:inline-block; width:18px; height:18px; border-radius:4px; border:1px solid #0003; vertical-align:middle; }
  .lock { min-width:40px; padding:6px; color:#94a3b8; border-color:#e2e8f0; display:inline-flex; align-items:center; justify-content:center; gap:4px; }
  .lock.on { background:#f59e0b; border-color:#d97706; color:#fff; }
  .lock .t { font-size:12px; font-weight:600; }
  .chip { display:flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:999px; padding:2px 4px 2px 2px; white-space:nowrap; }
  .chip.locked { border-color:#f59e0b; box-shadow:0 0 0 2px #fde68a; }
  .chip input[type=color] { width:32px; height:32px; border-radius:999px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; }
  .seg button { border:none; border-radius:999px; min-height:34px; padding:4px 14px; }
  .seg button.on { background:var(--ink); color:#fff; }
  .grid { display:flex; flex-direction:column; gap:16px; }
  @media (min-width:800px) { .grid { display:grid; grid-template-columns: 1fr 1fr; align-items:start; } .stage { position:sticky; top:12px; } }
  /* дерево участков */
  .tree { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .sec + .sec, .tree-head + .sec { border-top:1px solid var(--line); }
  .tree-head { cursor:default; background:var(--soft); }
  .sec-head { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; user-select:none; }
  .sec-head .name { font-weight:600; width:86px; }
  .mini { flex:1; height:14px; display:flex; border-radius:4px; overflow:hidden; border:1px solid #0002; }
  .sec-body { padding:4px 10px 12px 28px; background:#f8fafc; }
  .bar { position:relative; height:40px; display:flex; border-radius:8px; overflow:hidden; border:1px solid #0003; touch-action:none; margin:6px 0 10px; }
  .bar .part { height:100%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; min-width:0; }
  .bar .part.movable { cursor:grab; }
  .bar .part.dragging { cursor:grabbing; box-shadow:inset 0 0 0 3px #fff, inset 0 0 0 5px #0f172a; }
  .bar .grip { position:absolute; top:0; bottom:0; width:24px; margin-left:-12px; cursor:ew-resize; display:flex; justify-content:center; }
  .bar .grip::after { content:''; width:4px; height:100%; background:#fff; box-shadow:0 0 0 1px #0005; }
  .handle { cursor:grab; color:#94a3b8; font-size:20px; padding:0 4px; touch-action:none; user-select:none; }
  .ghost-row { opacity:.4; }
  .stripe { display:flex; align-items:center; gap:6px; padding:3px 0; }
  .swatches { display:flex; gap:4px; }
  .swatches button { width:28px; min-width:28px; height:28px; min-height:28px; padding:0; border-radius:6px; border:2px solid transparent; }
  .swatches button.on { border-color:var(--ink); box-shadow:inset 0 0 0 2px #fff; }
  .dock { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:8px 12px 56px; z-index:40;
    display:flex; gap:8px; align-items:center; overflow-x:auto; }
  .proto-bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:50; display:flex; gap:6px; align-items:center;
    background:#111; color:#fff; border-radius:999px; padding:6px 12px; box-shadow:0 4px 16px #0005; font-size:13px; }
  .proto-tag { background:#fde047; color:#111; font-weight:600; font-size:11px; padding:2px 6px; border-radius:4px; }
  details.q { margin-top:16px; border:2px dashed #f59e0b; border-radius:12px; padding:10px; background:#fffbeb; }
  details.q summary { cursor:pointer; font-weight:600; }
  details.q fieldset { border:none; padding:6px 0; margin:0; }
  details.q legend { font-weight:600; font-size:13px; }
  pre.dump { font-size:11px; background:#fff; border:1px solid var(--line); padding:8px; max-height:260px; overflow:auto; }
  .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#1e293b; color:#fff; padding:8px 12px;
    border-radius:10px; display:flex; gap:12px; align-items:center; z-index:60; }
  .toast button { background:transparent; color:#5eead4; border:none; min-height:32px; font-weight:600; }
  .modal-back { position:fixed; inset:0; background:#0006; display:flex; align-items:center; justify-content:center; z-index:70; }
  .modal { background:#fff; border-radius:14px; padding:16px; max-width:340px; }
  .confirm { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px #0003; padding:14px 16px 64px; z-index:45; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { createApp, reactive, computed, ref, watch } = Vue

/* ---------- ядро (будущий core/) ---------- */
const SECTIONS = ['резинка', 'паголенок', 'пятка', 'стопа', 'мысок']
const DEFAULT_ROWS = [20, 50, 30, 60, 20]
// готовые палитры; первая — расцветка по умолчанию
const PRESETS = {
  'синий + лён': ['#2f3e5c', '#e8e2d4'],
  'графит + горчица': ['#3a3a3c', '#d4a72c'],
  'бордо + серый меланж': ['#6d1f2f', '#b9b7b2'],
  'белый + красный': ['#f7f7f5', '#c8102e'],
  'лес': ['#264d36', '#8fae5d', '#e9dfc4'],
  'море': ['#1d3557', '#457b9d', '#a8dadc', '#f1faee'],
  'конфетти': ['#e63946', '#f4a261', '#2a9d8f', '#f1faee'],
  'осень': ['#7f2f1d', '#c96a2b', '#e8b04a', '#4a3b2f'],
}
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100
  if (a === 1 && b !== 11) return one
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few
  return many
}
const rowsText = n => `${n} ${plural(n, 'ряд', 'ряда', 'рядов')}`
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1))

function hexToOklab(hex) {
  const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)
  const [r, g, b] = v
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b)
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b)
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b)
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s]
}
const dist = (a, b) => { const p = hexToOklab(a), q = hexToOklab(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]) }
const isLight = hex => hexToOklab(hex)[0] > 0.7
function hsl(h, s, l) {
  s /= 100; l /= 100
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l)
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))
  return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('')
}

/** Целые доли total по весам, сумма ровно total, каждая ≥ 1 (метод наибольшего остатка). */
function apportion(weights, total) {
  const n = weights.length, base = Array(n).fill(1); let left = total - n
  if (left < 0) return base.slice(0, total).concat(Array(n - total).fill(0))
  const W = weights.reduce((a, b) => a + b, 0) || n
  const exact = weights.map(w => (W ? w / W : 1 / n) * left), fl = exact.map(Math.floor)
  let rest = left - fl.reduce((a, b) => a + b, 0)
  exact.map((e, i) => [e - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(([, i]) => fl[i]++)
  return base.map((b, i) => b + fl[i])
}

/** Раскладка рядов сверху вниз: полосы каждого участка подряд. */
function layout(st) {
  const out = []
  st.sections.forEach((s, si) => s.stripes.forEach(p => { for (let i = 0; i < p.r; i++) out.push({ s: si, c: p.c }) }))
  return out
}

const solid = (rows, c) => [{ c, r: rows }]
function defaultState(preset) {
  return {
    palette: PRESETS[preset].map(hex => ({ hex, lock: false })),
    sections: SECTIONS.map((name, i) => ({ name, rows: DEFAULT_ROWS[i], lock: false, stripes: solid(DEFAULT_ROWS[i], [0, 1, 0, 1, 0][i]) })),
  }
}
function whiteState() {
  return {
    palette: [{ hex: '#ffffff', lock: false }],
    sections: SECTIONS.map((name, i) => ({ name, rows: DEFAULT_ROWS[i], lock: false, stripes: solid(DEFAULT_ROWS[i], 0) })),
  }
}

/* ---------- состояние ---------- */
const q = reactive({ del: 'first', preset: 'синий + лён' })
const st = reactive(defaultState(q.preset))
const ui = reactive({ view: 'sock', open: { 1: true }, toast: null, lastGen: '', delAsk: null, presets: false, canUndo: false, canRedo: false })
function replaceState(next) { Object.assign(st, JSON.parse(JSON.stringify(next))) }
watch(() => q.preset, p => replaceState(defaultState(p)))

const rows = computed(() => layout(st))
const totals = computed(() => {
  const t = st.palette.map(() => 0); rows.value.forEach(r => t[r.c]++)
  const all = rows.value.length
  return t.map((n, i) => ({ i, n, pct: Math.round(100 * n / all) }))
})

/* полосы участка */
function addStripe(sec) {
  const n = sec.stripes.length
  if (n >= sec.rows) return
  const last = sec.stripes[n - 1].c
  const c = st.palette.length > 1 ? (last + 1) % st.palette.length : 0
  // новая полоса берёт долю 1/(n+1), предыдущие отдают пропорционально своей длине
  const share = Math.max(1, Math.round(sec.rows / (n + 1)))
  const kept = apportion(sec.stripes.map(p => p.r), sec.rows - share)
  sec.stripes.forEach((p, i) => p.r = kept[i])
  sec.stripes.push({ c, r: share })
}
function removeStripe(sec, i) {
  if (sec.stripes.length < 2) return
  const [gone] = sec.stripes.splice(i, 1)
  sec.stripes[Math.max(0, i - 1)].r += gone.r
}
/** Длину полосы правят числом: разницу забирает или отдаёт следующая (у последней — предыдущая). */
function setStripeRows(sec, i, v) {
  const nb = i + 1 < sec.stripes.length ? i + 1 : i - 1
  if (nb < 0) return
  const p = sec.stripes[i], o = sec.stripes[nb]
  const want = Math.max(1, Math.min(Math.round(v) || 1, p.r + o.r - 1))
  o.r += p.r - want; p.r = want
}
function moveBorder(sec, i, delta) { // граница между полосами i и i+1
  const a = sec.stripes[i], b = sec.stripes[i + 1]
  const d = Math.max(1 - a.r, Math.min(delta, b.r - 1))
  a.r += d; b.r -= d
}
/** Полосу двигают целиком, как раздел на диске: её длина та же, левая соседка растёт, правая сжимается. */
function moveStripe(sec, i, delta) {
  const L = sec.stripes[i - 1], R = sec.stripes[i + 1]
  if (!L || !R) return 0
  const d = Math.max(1 - L.r, Math.min(delta, R.r - 1))
  L.r += d; R.r -= d
  return d
}
function reorderStripe(sec, from, to) {
  if (from === to) return
  const [p] = sec.stripes.splice(from, 1); sec.stripes.splice(to, 0, p)
}
function setSectionRows(sec, v) {
  const n = Math.max(sec.stripes.length, Math.round(v) || 1)
  const r = apportion(sec.stripes.map(p => p.r), n)
  sec.stripes.forEach((p, i) => p.r = r[i]); sec.rows = n
}

/* палитра */
function usages(i) { return st.sections.filter(s => s.stripes.some(p => p.c === i)).map(s => s.name) }
function canDelete(i) { return st.palette.length > 1 && !(q.del === 'forbid' && usages(i).length) }
function deleteColor(i) {
  const hex = st.palette[i].hex
  st.palette.splice(i, 1)
  const repl = old => {
    if (old !== i) return old > i ? old - 1 : old
    if (q.del === 'nearest') { let best = 0, bd = Infinity; st.palette.forEach((p, j) => { const d = dist(p.hex, hex); if (d < bd) { bd = d; best = j } }); return best }
    return 0
  }
  st.sections.forEach(s => s.stripes.forEach(p => p.c = repl(p.c)))
}
function genColor(others) {
  for (let t = 0; t < 300; t++) { const c = hsl(rnd(0, 359), rnd(20, 85), rnd(18, 88)); if (others.every(o => dist(o, c) > 0.14)) return c }
  return hsl(rnd(0, 359), 60, 50)
}
function addColor() { if (st.palette.length < 6) st.palette.push({ hex: genColor(st.palette.map(p => p.hex)), lock: false }) }

/* генерация */
function genPalette() {
  for (let attempt = 0; attempt < 60; attempt++) {
    const hexes = st.palette.map(p => p.lock ? p.hex : null)
    hexes.forEach((h, i) => { if (!h) hexes[i] = genColor(hexes.filter(Boolean)) })
    const L = hexes.map(h => hexToOklab(h)[0])
    if (hexes.length < 2 || Math.max(...L) - Math.min(...L) > 0.3 || attempt === 59) { hexes.forEach((h, i) => st.palette[i].hex = h); return }
  }
}
/** Нарезка полос из текущей палитры: всех незакреплённых участков или одного (only). */
function genSections(only) {
  const n = st.palette.length
  // акцент — общий цвет резинки, пятки и мыска; для одного участка берём цвет уже стоящего края
  const edgeNow = [0, 2, 4].filter(i => i !== only).map(i => st.sections[i].stripes[0].c)
  const accent = only != null && edgeNow.length ? edgeNow[rnd(0, edgeNow.length - 1)] : rnd(0, n - 1)
  const pickNot = c => { if (n < 2) return 0; let x; do { x = rnd(0, n - 1) } while (x === c); return x }
  st.sections.forEach((s, i) => {
    if (s.lock || (only != null && i !== only)) return
    if (s.stripes.some(p => p.lock)) return regenAround(s)
    // резинка, пятка, мысок чаще однотон и общим акцентом; паголенок и стопа чаще в 2–4 полосы
    const edge = i === 0 || i === 2 || i === 4
    const k = Math.min(s.rows, edge ? (Math.random() < 0.75 ? 1 : 2) : [1, 2, 2, 3, 3, 4, 4][rnd(0, 6)])
    const cols = []; let c = edge && Math.random() < 0.8 ? accent : rnd(0, n - 1)
    for (let j = 0; j < k; j++) { cols.push(c); c = pickNot(c) }
    const r = apportion(Array.from({ length: k }, () => 0.4 + Math.random()), s.rows)
    s.stripes = cols.map((c, j) => ({ c, r: r[j] }))
  })
}
/**
 * В участке есть закреплённые полосы: они остаются цветом, длиной и местом. Незакреплённые
 * получают новые цвета (по возможности не как у соседей) и делят оставшиеся ряды заново.
 */
function regenAround(sec) {
  const n = st.palette.length, free = sec.stripes.map((p, i) => p.lock ? -1 : i).filter(i => i >= 0)
  if (!free.length) return
  const rest = sec.rows - sec.stripes.reduce((a, p) => a + (p.lock ? p.r : 0), 0)
  const r = apportion(free.map(() => 0.4 + Math.random()), rest)
  free.forEach((i, j) => {
    const p = sec.stripes[i], ban = [sec.stripes[i - 1]?.c, sec.stripes[i + 1]?.lock ? sec.stripes[i + 1].c : undefined]
    const ok = [...Array(n).keys()].filter(c => !ban.includes(c))
    p.c = ok.length ? ok[rnd(0, ok.length - 1)] : rnd(0, n - 1)
    p.r = r[j]
  })
}
const stamp = what => ui.lastGen = what + ', ' + new Date().toLocaleTimeString()
function rollPalette() { genPalette(); stamp('палитра') }
function rollSock() { genSections(); stamp('носок') }
function rollSection(i) { if (!st.sections[i].lock) { genSections(i); stamp(st.sections[i].name) } }

/* сброс */
/*
 * История действий: снимок расцветки до каждого изменения. Изменения, идущие подряд быстрее
 * 400 мс (перетаскивание границы, набор числа), склеиваются в один шаг. Живёт в памяти сессии.
 */
const past = [], future = []
let applying = false, pending = null, timer = null
const syncFlags = () => { ui.canUndo = past.length > 0 || pending != null; ui.canRedo = future.length > 0 }
const flush = () => { if (pending != null) { past.push(pending); if (past.length > 200) past.shift(); pending = null } clearTimeout(timer); syncFlags() }
watch(() => JSON.stringify(st), (now, before) => {
  if (applying) return
  if (pending == null) pending = before
  future.length = 0
  clearTimeout(timer); timer = setTimeout(flush, 400); syncFlags()
})
function travel(from, to) {
  flush(); if (!from.length) return
  to.push(JSON.stringify(st)); applying = true; replaceState(JSON.parse(from.pop()))
  Promise.resolve().then(() => { applying = false; syncFlags() })
}
const undo = () => travel(past, future), redo = () => travel(future, past)
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return
  const mod = e.ctrlKey || e.metaKey; if (!mod) return
  const k = e.key.toLowerCase()
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo() }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo() }
})

/** Сброс без подтверждения: его откатывает «Отменить», как любое действие. */
function doReset() {
  replaceState(whiteState())
  ui.toast = 'Носок сброшен'; clearTimeout(ui.t); ui.t = setTimeout(() => ui.toast = null, 6000)
}
function undoReset() { undo(); ui.toast = null }

/** Готовая палитра заменяет текущую; полосы с номером цвета за её пределами берут цвет по кругу. */
function applyPreset(name) {
  const hexes = PRESETS[name]
  st.palette = hexes.map(hex => ({ hex, lock: false }))
  st.sections.forEach(s => s.stripes.forEach(p => { if (p.c >= hexes.length) p.c = p.c % hexes.length }))
  ui.presets = false
}
/** Неиспользуемый цвет уходит сразу, используемый — после подтверждения; его полосы станут цветом 1. */
function askDeleteColor(i) {
  if (!canDelete(i)) return
  if (usages(i).length) ui.delAsk = i
  else deleteColor(i)
}

      else d.acc += store.moveStripe(props.s, d.i, want)
    }
    const up = () => { drag.value = null }
    const movable = i => i > 0 && i < props.s.stripes.length - 1
    const grips = computed(() => { let a = 0; return props.s.stripes.slice(0, -1).map(p => (a += p.r) / props.s.rows * 100) })

  <details class="q">
    <summary><span class="proto-tag">ПРОТОТИП</span> Отладка</summary>
    <div class="mute">Последняя генерация: {{ ui.lastGen || '—' }}</div>
    <details><summary class="mute">Состояние</summary><pre class="dump">{{ dump }}</pre></details>
  </details>`,
}

createApp({
  components: { SockL, SockTube, SectionNode, Totals, Lock, Questions },
  setup() { return store },
  template: `
  <div class="page" style="padding-bottom:180px">
    <h1>Расцветка носка</h1>
    <div class="grid" style="margin-top:10px">
      <div class="stage col">
        <div class="row" style="justify-content:flex-end">
          <div class="seg" role="group" aria-label="Вид">
            <button :class="{ on: ui.view !== 'tube' }" @click="ui.view = 'sock'">Носок</button>
            <button :class="{ on: ui.view === 'tube' }" @click="ui.view = 'tube'">Развёртка</button>
          </div>
        </div>
        <div v-if="st.palette.length < 2" class="mute">В палитре один цвет — полосы выйдут однотоном. Добавь цвета внизу.</div>
        <SockL v-if="ui.view !== 'tube'" :maxw="460"/>
        <SockTube v-else big/>
      </div>
      <div class="col">
        <div class="tree">
          <div class="sec-head tree-head">
            <span style="width:14px"></span>
            <span class="name">Участки</span>
            <span class="mute" style="flex:1">кубик справа — все незакреплённые разом</span>
            <button class="ghost" style="min-height:28px;min-width:28px;padding:0" title="Заново нарезать полосы всех незакреплённых участков" @click="rollSock">🎲</button>
            <span style="width:28px"></span>
          </div>
          <SectionNode v-for="(s, k) in st.sections" :key="s.name" :s="s" :k="k"/>
        </div>
        <section><h2 style="margin-bottom:6px">Итог</h2><Totals/></section>
      </div>
    </div>
    <Questions/>
  </div>
  <div class="dock">
    <span class="mute" style="white-space:nowrap">Палитра</span>
    <button class="primary" @click="rollPalette" title="Перебрать незакреплённые цвета">🎲</button>
    <div v-for="(p, i) in st.palette" :key="i" class="chip" :class="{ locked: p.lock }">
      <input type="color" v-model="p.hex"><span style="font-size:12px">{{ i + 1 }}</span>
      <Lock small :on="p.lock" @toggle="p.lock = !p.lock"/>
      <button class="ghost" style="min-height:28px;padding:0 4px" :disabled="!canDelete(i)" :title="usages(i).length ? 'Используется: ' + usages(i).join(', ') : 'Убрать цвет'" @click="askDeleteColor(i)">✕</button>
    </div>
    <button :disabled="st.palette.length >= 6" @click="addColor">+ цвет</button>
    <button @click="ui.presets = !ui.presets">Готовые ▾</button>
    <span style="flex:1"></span>
    <button :disabled="!ui.canUndo" @click="undo" title="Отменить (Ctrl+Z)">↶</button>
    <button :disabled="!ui.canRedo" @click="redo" title="Вернуть (Ctrl+Shift+Z)">↷</button>
    <button @click="doReset">Сбросить</button>
  </div>
  <div v-if="ui.presets" class="confirm" style="padding-bottom:120px">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Готовые палитры</b><button class="ghost" @click="ui.presets = false">Закрыть</button></div>
    <div class="col" style="gap:6px">
      <button v-for="(hexes, name) in PRESETS" :key="name" class="row" style="justify-content:flex-start" @click="applyPreset(name)">
        <span v-for="h in hexes" :key="h" class="sw" :style="{ background: h, width: '24px', height: '24px' }"></span>
        <span style="margin-left:6px">{{ name }}</span>
      </button>
    </div>
  </div>
  <div v-if="ui.delAsk != null" class="confirm" style="padding-bottom:120px">
    <div class="col" style="gap:8px">
      <span>Убрать цвет {{ ui.delAsk + 1 }}? Он в участках: {{ usages(ui.delAsk).join(', ') }} — там полосы станут цветом 1.</span>
      <div class="row"><button @click="deleteColor(ui.delAsk); ui.delAsk = null" style="border-color:#dc2626;color:#dc2626">Убрать</button><button @click="ui.delAsk = null">Отмена</button></div>
    </div>
  </div>
  <div v-if="ui.toast" class="toast">{{ ui.toast }} <button @click="undoReset">Отменить</button></div>
  <div class="proto-bar"><span class="proto-tag">ПРОТОТИП</span> участки из полос</div>`,
}).mount('#app')
</script>
</body>
</html>
