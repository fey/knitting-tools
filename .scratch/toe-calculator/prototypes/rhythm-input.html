<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОТОТИП — как задаётся ритм</title>
<!--
  ПРОТОТИП. Одноразовый код, отвечающий на один вопрос.
  Тикет: .scratch/toe-calculator/issues/03-rhythm-input.md

  Вопрос: какая форма ввода держит сразу два режима — «ритм один и простой»
  и «ритм из нескольких сегментов», — и годится ли она на телефоне.

  Четыре варианта на одном расчёте, переключение через #A … #D и стрелки ←/→:
    A — только пресеты (контроль: может, конструктор сегментов не нужен вовсе)
    B — пресеты + раскрывающийся список сегментов со степперами
    C — лента убавочных рядов, поделённая на фазы; границы двигают пальцем
    D — ритм читается фразой, числа — крупные мишени; хвост считается сам

  Главная ось сравнения: что происходит на переходе от одного сегмента
  к нескольким, и как на экране видно, что сегменты покрыли все убавочные ряды.
  Варианты отвечают на это по-разному и намеренно несовместимо:
    A — перехода нет вовсе;
    B — счётчик покрытия, недобор и перебор возможны и показаны;
    C — покрытие структурное, нарушить его нечем;
    D — последний сегмент забирает остаток сам, недобора не бывает.

  ЧТО ЗДЕСЬ ХОСТ, А НЕ ПРЕДМЕТ ОЦЕНКИ:
  - Расчёт рядов. Правило перенесено из calcToe прототипа row-progress.html:
    убавочный ряд убавляет 4 петли, после него идёт K промежуточных, хвост
    промежуточных перед швом не дорисовывается. Расширено на список сегментов.
  - Поля петель и кромки, шаг кнопок ±4, живая подсказка у конечных петель,
    порядок «сперва ритм, потом петли». Всё решено в тикете «Дефолты полей
    и пресеты ритма», здесь не пересматривается — здесь это рисуется.
  - Состав и формулы четырёх пресетов, правило остатка (лишний убавочный ряд
    ближе к концу мыска) — оттуда же.
  - Запись ритма в hash. Показана живьём внизу как проверка того, что форма
    ввода и принятая запись сходятся; сама запись решена в тикетах 05 и 07.

  ДОПУЩЕНИЯ ПРОТОТИПА, НЕ РЕШЕНИЯ:
  - Что делать при недоборе и переборе сегментов — жёсткий запрет, предупреждение
    или молчаливая правка — НЕ решается здесь. Это тикет «Краевые случаи
    и валидация ввода». Варианты B, C и D расходятся в том, КАК показывают
    покрытие, и это разница форм, а не выбранная политика.
  - Тексты ругани на недостижимые числа петель — туда же. Здесь поля просто
    принимают чётные числа.
  - Схема мыска не рисуется: тикет «Как выглядит визуализация мыска» закрыт,
    а сравнение силуэтов пресетов рядом отвергнуто в тикете 07. Живая обратная
    связь — число рядов, как там и решено. Лента рядов для проверки лежит
    в ручках прототипа, а не в дизайне.
  - Ни один текст не привязывается к полу. Требование проекта, не этого файла.
-->
<style>

<div class="wrap">

<script>
/* ---------------------------------------------------------------
   РАСЧЁТ — хост, а не предмет оценки.
   Правило перенесено из calcToe прототипа row-progress.html и расширено
   со «одного интервала» на список сегментов: убавочный ряд снимает
   4 петли, после него идут K промежуточных, хвост промежуточных перед
   швом не дорисовывается.

   Сегмент — { k: промежуточных после убавочного, m: сколько раз повторить }.
   Словарь карты: K — интервал, весь список — ритм.
   --------------------------------------------------------------- */

function decRoundsOf(initial, final) {          // сколько убавочных рядов нужно
  const diff = initial - final;
  return diff > 0 ? Math.floor(diff / 4) : 0;
}

function buildRows(initial, segs) {
  const rows = [];
  let st = initial, d = 0;
  segs.forEach(s => {
    for (let r = 0; r < s.m; r++) {
      st -= 4; d++;
      rows.push({ type: 'dec', dec: d, stitches: st });
      for (let i = 0; i < s.k; i++) rows.push({ type: 'plain', stitches: st });
    }
  });
  while (rows.length && rows[rows.length - 1].type === 'plain') rows.pop();  // хвоста перед швом нет
  rows.forEach((r, i) => { r.n = i + 1; });
  return rows;
}

function calc(initial, final, edge, segs) {
  const need = decRoundsOf(initial, final);
  const covered = segs.reduce((a, s) => a + s.m, 0);
  const rows = buildRows(initial, segs);
  return {
    initial, final, edge, segs, need, covered,
    rows, totalRows: rows.length,
    lack: need - covered,                       // >0 недобор, <0 перебор
    finalReal: initial - covered * 4,           // сколько петель останется на самом деле
  };
}

/* ---------------------------------------------------------------
   ПРЕСЕТЫ — тоже хост. Состав, коды и правило остатка («лишний убавочный
   ряд уходит ближе к концу мыска») решены в тикете «Дефолты полей
   и пресеты ритма», таблица в пункте 4 его Answer.
   --------------------------------------------------------------- */
const PRESETS = [
  {
    code: 'even', name: 'Через ряд', min: 1,
    how: 'убавочный, потом один промежуточный — и так до конца',
    segs: N => [{ k: 1, m: N }],
  },
  {
    code: 'accel', name: 'С ускорением', min: 2,
    how: 'сперва через ряд, вторая половина — каждый ряд',
    segs: N => [{ k: 1, m: Math.ceil(N / 2) }, { k: 0, m: Math.floor(N / 2) }],
  },
  {
    code: 'thirds', name: 'По третям', min: 3,
    how: 'три фазы: через два ряда, через ряд, каждый ряд',
    segs: N => { const t = Math.floor(N / 3); return [{ k: 2, m: t }, { k: 1, m: t }, { k: 0, m: N - 2 * t }]; },
  },
  {
    code: 'ramp', name: 'С разгоном', min: 5,
    how: 'первые убавки редкие, дальше подряд каждый ряд',
    segs: N => [{ k: 4, m: 1 }, { k: 3, m: 1 }, { k: 2, m: 1 }, { k: 1, m: 1 }, { k: 0, m: N - 4 }],
  },
];

const presetByCode = c => PRESETS.find(p => p.code === c);

function presetRows(p, N, initial) {            // живое число рядов для подписи
  if (N < p.min) return null;
  return buildRows(initial, p.segs(N)).length;
}

function presetWhyOff(p, N) {
  return 'нужно ' + p.min + ' убавочных ' + plural(p.min, 'ряд', 'ряда', 'рядов')
       + ', сейчас ' + N;
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function segsEqual(a, b) {
  return a.length === b.length && a.every((s, i) => s.k === b[i].k && s.m === b[i].m);
}

/* Запись ритма в hash — тикет 07, пункт 7: имя пресета либо сегменты
   через запятую. Показана внизу живьём как проверка, что форма ввода
   и принятая запись сходятся. */
function hashOf(st) {
  const r = st.preset === 'custom'
    ? st.segs.map(s => s.k + 'x' + s.m).join(',')
    : st.preset;
  return '#s=' + st.initial + '&e=' + st.final + '&k=' + st.edge + '&r=' + r;
}

/* ---------------------------------------------------------------
   СОСТОЯНИЕ. Дефолты — тикет 07: 60 → 20, кромка 1, ритм «через ряд».
   --------------------------------------------------------------- */
const st = {
  variant: 'A',
  initial: 60, final: 20, edge: 1,
  preset: 'even',            // код пресета или 'custom'
  segs: [{ k: 1, m: 10 }],
  segsOpen: false,           // B: раскрыт ли список сегментов
  slot: null,                // D: какое число сейчас крутится
};

/* Пресет живой (тикет 07, пункт 6): меняются петли — сегменты
   пересчитываются сами. Ручная правка переводит ритм в «свой». */
function resyncPreset() {
  if (st.preset === 'custom') return;
  const p = presetByCode(st.preset);
  const N = decRoundsOf(st.initial, st.final);
  if (N < p.min) {                       // пресет перестал собираться — уходим на ближайший живой
    const alt = PRESETS.filter(q => N >= q.min).pop() || PRESETS[0];
    st.preset = N >= alt.min ? alt.code : 'custom';
    if (st.preset === 'custom') { st.segs = [{ k: 1, m: Math.max(N, 1) }]; return; }
    st.segs = presetByCode(st.preset).segs(N);
    return;
  }
  st.segs = p.segs(N);
}

function goCustom() {
  st.preset = 'custom';
}

/* Развилка, найденная на прототипе: свой ритм может совпасть с пресетом
   до сегмента («через ряд × 5, каждый ряд × 5» — это и есть «с ускорением»
   при N = 10). Тогда одна и та же форма мыска получает две записи в hash.
   Что правильно — решается не здесь; ручка показывает оба поведения. */
let snapBack = false;
function maybeSnapBack() {
  if (!snapBack || st.preset !== 'custom') return;
  const N = decRoundsOf(st.initial, st.final);
  const hit = PRESETS.find(p => N >= p.min && segsEqual(st.segs, p.segs(N)));
  if (hit) st.preset = hit.code;
}

function setPreset(code) {
  st.preset = code;
  resyncPreset();
  draw();
}

/* ---------------------------------------------------------------
   ОБЩИЕ КУСКИ ЭКРАНА. Одинаковы во всех вариантах, чтобы ось сравнения
   осталась одна: как задаётся ритм вручную. Порядок «сперва ритм, потом
   петли» — решение тикета 07, пункт 10.
   --------------------------------------------------------------- */

function intervalPhrase(k) {
  if (k === 0) return 'каждый ряд';
  if (k === 1) return 'через ряд';
  return 'через ' + k + ' ' + plural(k, 'ряд', 'ряда', 'рядов');
}

function rowsWord(n) { return n + ' ' + plural(n, 'ряд', 'ряда', 'рядов'); }

function presetsBlock(m) {
  const N = m.need;
  const items = PRESETS.map(p => {
    const rows = presetRows(p, N, st.initial);
    const off = rows === null;
    const on = st.preset === p.code;
    return '<button class="preset' + (on ? ' on' : '') + '"' + (off ? ' disabled' : '')
      + ' onclick="setPreset(\'' + p.code + '\')">'
      + '<span class="dot"></span>'
      + '<span class="body"><span class="name">' + p.name + '</span>'
      + '<span class="how">' + p.how + '</span></span>'
      + '<span class="rows">' + (off ? presetWhyOff(p, N) : rowsWord(rows)) + '</span>'
      + '</button>';
  }).join('');

  const custom = st.preset === 'custom'
    ? '<button class="preset custom on" onclick="void 0">'
      + '<span class="dot"></span>'
      + '<span class="body"><span class="name">Свой ритм</span>'
      + '<span class="how">' + st.segs.map(s => intervalPhrase(s.k) + ' × ' + s.m).join(', ') + '</span></span>'
      + '<span class="rows">' + rowsWord(m.totalRows) + '</span>'
      + '</button>'
    : '';

  return '<div class="presets">' + items + custom + '</div>';
}

function stitchesBlock(m) {
  const near = [st.final - 4, st.final, st.final + 4]
    .filter(v => v >= 4 && v < st.initial);
  return '<div class="card">'
    + '<h2>Петли</h2>'
    + '<div class="field">'
    +   '<div class="lab">Начальные петли</div>'
    +   '<div class="why">Сколько петель в круге на момент начала мыска. Чётное.</div>'
    +   '<div class="line">'
    +     '<div class="step"><button onclick="bumpStitch(\'initial\',-4)">−</button></div>'
    +     '<input class="num" id="f-init" type="number" inputmode="numeric" value="' + st.initial + '">'
    +     '<div class="step"><button onclick="bumpStitch(\'initial\',4)">+</button></div>'
    +   '</div>'
    + '</div>'
    + '<div class="field">'
    +   '<div class="lab">Конечные петли</div>'
    +   '<div class="why">Сколько остаётся на трикотажный шов: обычно 16–24. '
    +     'Привычное стягивание с 8 петлями — другой мысок.</div>'
    +   '<div class="line">'
    +     '<div class="step"><button onclick="bumpStitch(\'final\',-4)">−</button></div>'
    +     '<input class="num" id="f-final" type="number" inputmode="numeric" value="' + st.final + '">'
    +     '<div class="step"><button onclick="bumpStitch(\'final\',4)">+</button></div>'
    +   '</div>'
    +   '<div class="hint">' + st.final + ' (шаг 4: ' + near.join(', ') + ')</div>'
    + '</div>'
    + '<div class="field">'
    +   '<div class="lab">Кромка</div>'
    +   '<div class="why">Сколько петель с краю половины остаётся до места убавки.</div>'
    +   '<div class="edge-row">'
    +     [0, 1, 2].map(e =>
            '<button class="' + (st.edge === e ? 'on' : '') + '" onclick="setEdge(' + e + ')">'
            + '<b>' + e + '</b><span>' + (e === 2 ? 'широкий мысок' : '&nbsp;') + '</span></button>'
          ).join('')
    +   '</div>'
    + '</div>'
    + '</div>';
}

function totalBlock(m) {
  return '<div class="card">'
    + '<h2>Итог</h2>'
    + '<div class="total">'
    +   '<span class="big">' + m.totalRows + '</span>'
    +   '<span class="side">' + plural(m.totalRows, 'ряд', 'ряда', 'рядов') + ' в мыске · '
    +     m.covered + ' ' + plural(m.covered, 'убавочный', 'убавочных', 'убавочных') + ' · '
    +     'останется ' + m.finalReal + ' ' + plural(m.finalReal, 'петля', 'петли', 'петель') + '</span>'
    + '</div>'
    + '<div class="hashline">' + hashOf(st) + '</div>'
    + '</div>';
}

function coverLine(m) {
  if (m.lack === 0) return '<div class="cover">Сегменты покрывают все ' + m.need
    + ' ' + plural(m.need, 'убавочный ряд', 'убавочных ряда', 'убавочных рядов') + '.</div>';
  if (m.lack > 0) return '<div class="cover bad">Не хватает ' + m.lack + ' '
    + plural(m.lack, 'убавочного ряда', 'убавочных рядов', 'убавочных рядов')
    + ': останется ' + m.finalReal + ' петель вместо ' + st.final + '.</div>';
  return '<div class="cover bad">Убавочных рядов на ' + (-m.lack) + ' больше, чем нужно'
    + ': останется ' + m.finalReal + ' петель вместо ' + st.final + '.</div>';
}

/* ---------------------------------------------------------------
   ВАРИАНТ A — только пресеты. Контроль.
   Проверяет, нужен ли конструктор сегментов вообще: может, четырёх
   готовых ритмов хватает, а ручной режим — это то, чего никто не трогает.
   --------------------------------------------------------------- */
function renderA(m) {
  return '<div class="card">'
    + '<h2>Ритм убавок</h2>'
    + presetsBlock(m)
    + '<div class="note"><b>Контроль.</b> Ручного ритма здесь нет вовсе. '
    + 'Модель карты («убавочный ряд + K промежуточных, повторить M раз») в интерфейс не выходит — '
    + 'её видно только через четыре готовых ритма. Спорить с этим вариантом должны B, C и D: '
    + 'если ни один не выигрывает заметно, конструктор в v1 не нужен.</div>'
    + '</div>';
}

/* ---------------------------------------------------------------
   ВАРИАНТ B — пресеты плюс раскрывающийся список сегментов.
   Прямая форма модели карты: строка на сегмент, два степпера в строке.
   Покрытие показано счётчиком; недобор и перебор возможны и видны.
   --------------------------------------------------------------- */
function renderB(m) {
  let body = '';
  if (!st.segsOpen) {
    body = '<button class="segopen" onclick="toggleSegs()">Настроить ритм по шагам ▾</button>';
  } else {
    const rows = st.segs.map((s, i) =>
      '<div class="seg">'
      + '<div class="seg-head"><span>Шаг ' + (i + 1) + ' из ' + st.segs.length + '</span>'
      +   '<button class="seg-del" onclick="delSeg(' + i + ')"'
      +   (st.segs.length < 2 ? ' disabled' : '') + '>Убрать</button></div>'
      + '<div class="seg-part">'
      +   '<span class="txt">убавочный ряд, потом</span>'
      +   stepper('seg-k-' + i, s.k, 'bumpSeg(' + i + ',\'k\',-1)', 'bumpSeg(' + i + ',\'k\',1)', s.k <= 0, s.k >= 6)
      +   '<span class="txt">' + plural(s.k, 'промежуточный', 'промежуточных', 'промежуточных') + '</span>'
      + '</div>'
      + '<div class="seg-part">'
      +   '<span class="txt">повторить</span>'
      +   stepper('seg-m-' + i, s.m, 'bumpSeg(' + i + ',\'m\',-1)', 'bumpSeg(' + i + ',\'m\',1)', s.m <= 1, false)
      +   '<span class="txt">' + plural(s.m, 'раз', 'раза', 'раз') + '</span>'
      + '</div>'
      + '</div>'
    ).join('');
    body = rows
      + '<button class="seg-add" onclick="addSeg()">+ ещё шаг</button>'
      + coverLine(m)
      + '<button class="segopen" onclick="toggleSegs()">Свернуть ▴</button>';
  }
  return '<div class="card">'
    + '<h2>Ритм убавок</h2>'
    + presetsBlock(m)
    + body
    + '<div class="note">Список — прямой перевод модели карты на экран. '
    + 'Переход к нескольким сегментам стоит одного нажатия «+ ещё шаг», но покрытие '
    + 'приходится сторожить счётчиком: ни недобор, ни перебор конструкцией не запрещены.</div>'
    + '</div>';
}

function stepper(id, val, onMinus, onPlus, offMinus, offPlus) {
  return '<span class="step">'
    + '<button onclick="' + onMinus + '"' + (offMinus ? ' disabled' : '') + '>−</button>'
    + '<span class="val">' + val + '</span>'
    + '<button onclick="' + onPlus + '"' + (offPlus ? ' disabled' : '') + '>+</button>'
    + '</span>';
}

/* ---------------------------------------------------------------
   ВАРИАНТ C — лента убавочных рядов, поделённая на фазы.
   Лента длиной ровно в нужное число убавочных рядов; границы двигают
   пальцем, тап по клетке ставит или убирает границу. Покрытие
   структурное: сумма фаз всегда равна ленте, нарушить нечем.
   --------------------------------------------------------------- */
function renderC(m) {
  const N = m.need;
  let strip = '';
  if (N < 1) {
    strip = '<div class="cover bad">Убавочных рядов нет: разница петель меньше четырёх.</div>';
  } else {
    const phaseOf = [];
    st.segs.forEach((s, pi) => { for (let r = 0; r < s.m; r++) phaseOf.push(pi); });
    while (phaseOf.length < N) phaseOf.push(st.segs.length - 1);
    const cells = [];
    for (let i = 0; i < N; i++)
      cells.push('<span class="cell p' + (phaseOf[i] % 5) + '" data-i="' + i + '"></span>');
    const grips = [];
    let cum = 0;
    st.segs.forEach((s, i) => {
      cum += s.m;
      if (i < st.segs.length - 1 && cum < N)
        grips.push('<span class="grip" data-b="' + i + '" style="left:' + (cum / N * 100) + '%"></span>');
    });
    const phases = st.segs.map((s, i) =>
      '<div class="phase">'
      + '<span class="chip p' + (i % 5) + '"></span>'
      + '<span class="txt"><b>' + s.m + '</b> ' + plural(s.m, 'убавочный ряд', 'убавочных ряда', 'убавочных рядов')
      +   ' — <b>' + intervalPhrase(s.k) + '</b></span>'
      + stepper('ph-' + i, s.k, 'bumpSeg(' + i + ',\'k\',-1)', 'bumpSeg(' + i + ',\'k\',1)', s.k <= 0, s.k >= 6)
      + '</div>'
    ).join('');
    strip = '<div class="strip" id="strip">' + cells.join('') + grips.join('') + '</div>'
      + '<div class="hint">Лента — это ' + N + ' ' + plural(N, 'убавочный ряд', 'убавочных ряда', 'убавочных рядов')
      + ', все до единого. Потяни кружок, чтобы сдвинуть границу фазы; тапни по клетке, чтобы поставить или убрать границу.</div>'
      + phases;
  }
  return '<div class="card">'
    + '<h2>Ритм убавок</h2>'
    + presetsBlock(m)
    + strip
    + '<div class="note">Лента показывает то, что в B приходится складывать в уме: '
    + '<b>сколько убавочных рядов нужно и как они разошлись по фазам</b>. '
    + 'Недобора и перебора здесь не бывает — их нечем сделать. Цена: число повторов '
    + 'задаётся только пальцем по ленте, точного ввода «ровно 6 раз» нет.</div>'
    + '</div>';
}

/* ---------------------------------------------------------------
   ВАРИАНТ D — ритм читается фразой, числа крупные и нажимаются.
   Последняя строка забирает остаток сама и не редактируется:
   недобора не бывает, перебор предыдущих строк — бывает и назван.
   --------------------------------------------------------------- */
function renderD(m) {
  const N = m.need;
  const last = st.segs.length - 1;
  let prev = 0;
  const lines = st.segs.map((s, i) => {
    const isLast = i === last;
    const rest = N - prev;
    prev += s.m;
    const head = st.segs.length === 1 ? 'Убавлять'
               : i === 0 ? 'Сначала'
               : isLast ? 'потом' : 'затем';
    const kSlot = '<button class="slot' + (isSlot(i, 'k') ? ' on' : '') + '" onclick="tapSlot(' + i + ',\'k\')">'
                + intervalPhrase(s.k) + '</button>';
    const mSlot = isLast
      ? '<span class="slot fixed">' + (rest > 0 ? rest : 0) + '</span>'
      : '<button class="slot' + (isSlot(i, 'm') ? ' on' : '') + '" onclick="tapSlot(' + i + ',\'m\')">' + s.m + '</button>';
    const only = st.segs.length === 1;     // единственная строка забирает все убавочные ряды
    const tail = isLast
      ? (rest > 0
          ? ' — ' + mSlot + ' ' + (only ? plural(rest, 'раз', 'раза', 'раз')
                                        : plural(rest, 'оставшийся раз', 'оставшихся раза', 'оставшихся раз'))
          : ' — <span class="slot fixed">0</span> раз')
      : ' — ' + mSlot + ' ' + plural(s.m, 'раз', 'раза', 'раз');
    const del = st.segs.length > 1 && isLast
      ? '<button class="phrase-del" onclick="delSeg(' + i + ')">убрать</button>' : '';
    return '<div class="phrase-line">' + head + ' ' + kSlot + tail + (isLast ? '.' : ',') + ' ' + del + '</div>'
      + popFor(i);
  }).join('');

  const over = m.lack < 0
    ? '<div class="cover bad">Строки выше забрали на ' + (-m.lack) + ' '
      + plural(-m.lack, 'убавочный ряд', 'убавочных ряда', 'убавочных рядов') + ' больше, чем есть. '
      + 'Последней строке не осталось ничего.</div>'
    : '';

  return '<div class="card">'
    + '<h2>Ритм убавок</h2>'
    + presetsBlock(m)
    + '<div class="phrase">' + lines + '</div>'
    + over
    + '<button class="phrase-add" onclick="addSeg()">…а дальше по-другому</button>'
    + '<div class="note">Ритм читается вслух, а не собирается из полей. '
    + 'Последняя строка <b>считается сама</b> — остаток убавочных рядов уходит ей, '
    + 'поэтому «не покрыли всё» здесь не случается. Цена: этим числом нельзя управлять напрямую, '
    + 'а строк больше трёх фраза не держит — читаться перестаёт.</div>'
    + '</div>';
}

function isSlot(i, f) { return st.slot && st.slot.i === i && st.slot.f === f; }

function popFor(i) {
  if (!st.slot || st.slot.i !== i) return '';
  const s = st.segs[i], f = st.slot.f;
  const cap = f === 'k'
    ? 'Сколько промежуточных рядов идёт после убавочного'
    : 'Сколько раз повторить';
  return '<div class="pop"><div class="cap">' + cap + '</div>'
    + stepper('pop', f === 'k' ? s.k : s.m,
        'bumpSeg(' + i + ',\'' + f + '\',-1)', 'bumpSeg(' + i + ',\'' + f + '\',1)',
        f === 'k' ? s.k <= 0 : s.m <= 1, f === 'k' && s.k >= 6)
    + ' <button class="phrase-del" onclick="closeSlot()">готово</button></div>';
}

/* ---------------------------------------------------------------
   ДЕЙСТВИЯ.
   --------------------------------------------------------------- */
function bumpStitch(which, d) {
  const v = st[which] + d;
  if (which === 'initial' && (v < 8 || v > 200)) return;
  if (which === 'final' && (v < 4 || v >= st.initial)) return;
  st[which] = v;
  resyncPreset();
  draw();
}

function setStitch(which, raw) {
  const v = parseInt(raw, 10);
  if (!isFinite(v)) return;
  st[which] = v;
  resyncPreset();
  draw();
}

function setEdge(e) { st.edge = e; draw(); }

function toggleSegs() { st.segsOpen = !st.segsOpen; draw(); }

function addSeg() {
  goCustom();
  const last = st.segs[st.segs.length - 1];
  if (last.m > 1) {                       // делим последний пополам, остаток — ближе к концу
    const head = Math.floor(last.m / 2);
    last.m -= head;
    st.segs.splice(st.segs.length - 1, 0, { k: last.k, m: head });
    last.k = Math.max(last.k - 1, 0);
  } else {
    st.segs.push({ k: Math.max(last.k - 1, 0), m: 1 });
  }
  st.segsOpen = true;
  draw();
}

function delSeg(i) {
  if (st.segs.length < 2) return;
  goCustom();
  st.segs.splice(i, 1);
  if (st.slot && st.slot.i >= st.segs.length) st.slot = null;
  draw();
}

function bumpSeg(i, f, d) {
  goCustom();
  const s = st.segs[i];
  if (f === 'k') s.k = Math.max(0, Math.min(6, s.k + d));
  else s.m = Math.max(1, s.m + d);
  draw();
}

function tapSlot(i, f) {
  st.slot = isSlot(i, f) ? null : { i, f };
  draw();
}
function closeSlot() { st.slot = null; draw(); }

/* Инварианты вариантов. C держит сумму фаз равной ленте — в этом весь его
   смысл. D считает хвост сам. B и A ничего не правят: там покрытие
   показывается, а не чинится. Что из этого правильно — тикет о краевых
   случаях, здесь это разные формы, а не выбранная политика. */
function normalizeForVariant() {
  maybeSnapBack();
  const N = decRoundsOf(st.initial, st.final);
  if (st.preset !== 'custom') return;     // пресет уже покрывает ровно N
  if (st.variant === 'C') {
    if (N < 1) { st.segs = [{ k: 1, m: 1 }]; return; }
    const segs = st.segs.map(s => ({ k: s.k, m: s.m }));
    while (segs.length > 1 && segs.slice(0, -1).reduce((a, s) => a + s.m, 0) >= N) segs.pop();
    const others = segs.slice(0, -1).reduce((a, s) => a + s.m, 0);
    segs[segs.length - 1].m = N - others;
    st.segs = segs;
  } else if (st.variant === 'D') {
    const others = st.segs.slice(0, -1).reduce((a, s) => a + s.m, 0);
    st.segs[st.segs.length - 1].m = Math.max(N - others, 0);
  }
}

/* ---------------------------------------------------------------
   ЛЕНТА ФАЗ: перетаскивание границ и тап по клетке. Только для C.
   --------------------------------------------------------------- */
function wireStrip() {
  const strip = document.getElementById('strip');
  if (!strip) return;
  const N = decRoundsOf(st.initial, st.final);

  const indexAt = clientX => {
    const r = strip.getBoundingClientRect();
    return Math.round((clientX - r.left) / r.width * N);
  };

  strip.querySelectorAll('.grip').forEach(g => {
    let live = false;
    g.addEventListener('pointerdown', e => {
      live = true; e.preventDefault();
      try { g.setPointerCapture(e.pointerId); } catch (err) {}
    });
    g.addEventListener('pointermove', e => {
      if (!live) return;
      const b = +g.dataset.b;                       // граница между сегментами b и b+1
      const before = st.segs.slice(0, b).reduce((a, s) => a + s.m, 0);
      const pair = st.segs[b].m + st.segs[b + 1].m;
      let head = indexAt(e.clientX) - before;
      head = Math.max(1, Math.min(pair - 1, head));
      if (head === st.segs[b].m) return;
      goCustom();
      st.segs[b].m = head;
      st.segs[b + 1].m = pair - head;
      draw();
    });
    const stop = () => { live = false; };
    g.addEventListener('pointerup', stop);
    g.addEventListener('pointercancel', stop);
  });

  strip.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('click', () => {
      const i = +c.dataset.i;                       // граница ставится ПЕРЕД этой клеткой
      if (i === 0) return;
      goCustom();
      let cum = 0, hit = -1;
      st.segs.forEach((s, si) => { cum += s.m; if (cum === i && si < st.segs.length - 1) hit = si; });
      if (hit >= 0) {                               // граница уже есть — убираем, фазы сливаются
        st.segs[hit].m += st.segs[hit + 1].m;
        st.segs.splice(hit + 1, 1);
      } else {
        cum = 0;
        for (let si = 0; si < st.segs.length; si++) {
          const next = cum + st.segs[si].m;
          if (i > cum && i < next) {
            const head = i - cum, tail = next - i;
            st.segs[si].m = head;
            st.segs.splice(si + 1, 0, { k: Math.max(st.segs[si].k - 1, 0), m: tail });
            break;
          }
          cum = next;
        }
      }
      draw();
    });
  });
}

/* ---------------------------------------------------------------
   СБОРКА ЭКРАНА.
   --------------------------------------------------------------- */
const VARIANTS = {
  A: { name: 'A — только пресеты', render: renderA },
  B: { name: 'B — список сегментов', render: renderB },
  C: { name: 'C — лента фаз', render: renderC },
  D: { name: 'D — ритм фразой', render: renderD },
};
const ORDER = ['A', 'B', 'C', 'D'];

function draw() {
  normalizeForVariant();
  const m = calc(st.initial, st.final, st.edge, st.segs);

  const focused = document.activeElement;
  const keepId = focused && focused.id ? focused.id : null;
  const keepPos = focused && focused.selectionStart != null ? focused.selectionStart : null;

  document.getElementById('view').innerHTML =
    VARIANTS[st.variant].render(m) + stitchesBlock(m) + totalBlock(m);

  const back = keepId && document.getElementById(keepId);
  if (back && back.focus) {
    back.focus();
    if (keepPos != null && back.setSelectionRange) {
      try { back.setSelectionRange(keepPos, keepPos); } catch (e) {}
    }
  }

  document.getElementById('f-init').addEventListener('input', e => setStitch('initial', e.target.value));
  document.getElementById('f-final').addEventListener('input', e => setStitch('final', e.target.value));
  wireStrip();

  document.getElementById('vname').textContent = st.variant;
  document.getElementById('sub').textContent =
    VARIANTS[st.variant].name + ' · ' + st.initial + ' → ' + st.final + ' петель, кромка ' + st.edge;

  document.getElementById('i-init').value = st.initial;
  document.getElementById('i-final').value = st.final;
  document.getElementById('i-edge').value = st.edge;

  const rib = document.getElementById('ribbon');
  rib.innerHTML = m.rows.map(r => '<i class="' + (r.type === 'dec' ? 'dec' : '') + '"></i>').join('');
  document.getElementById('ribbon-note').textContent =
    'Нужно убавочных: ' + m.need + ' · в ритме: ' + m.covered
    + ' · рядов всего: ' + m.totalRows
    + (m.lack ? ' · РАСХОЖДЕНИЕ: ' + m.lack : '');
}

function setVariant(v) {
  if (!VARIANTS[v]) return;
  st.variant = v;
  st.slot = null;
  if (v === 'A' && st.preset === 'custom') st.preset = 'even';   // в A своего ритма нет
  if (st.preset !== 'custom') resyncPreset();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}   // file:// ругается, прототипу всё равно
  draw();
}

document.getElementById('prev').onclick = () =>
  setVariant(ORDER[(ORDER.indexOf(st.variant) + ORDER.length - 1) % ORDER.length]);
document.getElementById('next').onclick = () =>
  setVariant(ORDER[(ORDER.indexOf(st.variant) + 1) % ORDER.length]);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});

['i-init', 'i-final', 'i-edge'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    if (!isFinite(v)) return;
    if (id === 'i-init') st.initial = v;
    if (id === 'i-final') st.final = v;
    if (id === 'i-edge') st.edge = Math.max(0, Math.min(2, v));
    resyncPreset();
    draw();
  });
});

document.getElementById('i-snap').addEventListener('change', e => {
  snapBack = e.target.value === 'snap';
  draw();
});

document.getElementById('i-width').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10) || 0;
  document.querySelector('.wrap').style.maxWidth = v > 0 ? v + 'px' : '560px';
});

const start = (location.hash || '#A').slice(1).toUpperCase();
st.variant = VARIANTS[start] ? start : 'A';
setVariant(st.variant);
</script>
