<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОТОТИП — табличка размеров</title>
<!--
  ПРОТОТИП. Одноразовый код, отвечающий на один вопрос.
  Исследование: ../research/sock-size-charts.md

  Вопрос: как выглядит табличка размеров, если ведущая величина — ДЛИНА СТОПЫ
  в сантиметрах, и табличка живёт сразу в двух ролях — самостоятельным
  справочником и подстройкой мыска.

  Три варианта на одних данных, переключение через #A … #C и стрелки ←/→.
  Ось сравнения — НАПРАВЛЕНИЕ ХОДА, потому что в этом вся разница:
    A — справочник: все строки сразу, читается глазами
    B — размер → мерки: знаешь обувной номер (вяжешь в подарок)
    C — мерка → размер: померил стопу линейкой, ищешь строку

  ЧТО ЗДЕСЬ ДАННЫЕ ИСТОЧНИКА, А НЕ ПРЕДМЕТ ОЦЕНКИ:
  - Все числа мужской таблицы — Kate Atherley, «Custom Socks» (Interweave, 2015),
    таблицы выложены автором: kateatherley.com/2017/08/10/foot-size-tables/
    Прочитаны дословно, перенесены без правки. Разбор — research §3.1.
  - «Размер РФ» = длина стопы в сантиметрах. Так в ГОСТ 8541-2014 п. 4.2.3
    («Размер чулочно-носочных изделий характеризуется длиной стопы
    в сантиметрах»), мужской ряд 23, 25, 27, 29, 31, 33. Разбор — research §2.3.
  - Доля мыска 0,20 от длины стопы — ../../toe-calculator/research/decrease-rhythms.md §5.

  ДОПУЩЕНИЯ ПРОТОТИПА, НЕ РЕШЕНИЯ:
  - ТОЛЬКО МУЖСКАЯ ШКАЛА, и только потому, что мастер попросил начать с неё.
    Подписана шкала обуви («US муж.»), а не тот, кто носит: у Atherley на общем
    EUR мужские и женские мерки почти совпадают, расщепление сидит в шкале US
    и больше нигде (research §6). Как будет устроен полный набор шкал —
    не решается здесь.
  - Попадание длины стопы в номер ряда ГОСТ — АРИФМЕТИКА ПРОТОТИПА, не цитата:
    ближайший нечётный номер, на равном расстоянии берётся больший. В источнике
    такого правила нет, длина следа по мужскому ряду не найдена вовсе
    (research, «Осталось непроверенным»).
  - Обхват стопы показан только в справочнике и приглушён: мастер сказал, что
    ведущая величина — длина. Полный разбор обхвата остаётся в research §3, §5.1.
  - Стыковка с калькулятором показана одной строкой «что уедет в мысок»
    и живьём не считает число рядов: для него нужна плотность, а поля плотности
    в проекте пока нет вовсе.
  - Ни один текст не привязывается к полу. Требование проекта, не этого файла.
-->
<style>
  :root {
    --bg: #fbfaf8; --fg: #1c1a17; --muted: #6f6a62; --line: #e2ddd5;
    --accent: #b4472a; --accent-soft: #f4ded6; --plain: #ece8e1;
    --card: #ffffff; --ok: #3c5230; --ok-soft: #eef3ea; --ok-line: #c3d4b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 86px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 0; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .protobadge {
    display: inline-block; background: #1c1a17; color: #fff; font-size: 11px;
    letter-spacing: .08em; padding: 2px 7px; border-radius: 3px; vertical-align: 3px;
    margin-right: 6px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin: 0 0 12px;
  }
  .note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .note code { background: var(--plain); padding: 1px 4px; border-radius: 3px; }

  /* ── A: справочник ── */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: right; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    position: sticky; top: 0; background: var(--bg); font-size: 11.5px; font-weight: 600;
    color: var(--muted); line-height: 1.25; border-bottom: 2px solid var(--line);
  }
  .spine { background: var(--accent-soft); font-weight: 600; }
  thead .spine { background: var(--accent-soft); color: var(--accent); }
  .dim { color: var(--muted); font-size: 12.5px; }
  tbody tr:hover td { background: #fff7f4; }
  .scroller { overflow-x: auto; margin: 0 -4px; }

  /* ── B: размер → мерки ── */
  .scalebar { display: flex; gap: 6px; margin: 0 0 10px; }
  .scalebar button {
    flex: 1; padding: 7px 0; font-size: 13px; font-family: inherit;
    border: 1px solid var(--line); background: var(--card); border-radius: 7px; cursor: pointer;
  }
  .scalebar button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    min-width: 52px; padding: 9px 8px; font-size: 14px; font-family: inherit;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); background: var(--card); border-radius: 7px; cursor: pointer;
  }
  .chips button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .readout { display: flex; gap: 10px; margin: 12px 0 0; }
  .readout > div {
    flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--card);
  }
  .readout .lab { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
  .readout .val { font-size: 26px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .readout .val span { font-size: 14px; color: var(--muted); }
  .readout .lead { border-color: var(--accent); background: var(--accent-soft); }

  /* ── C: мерка → размер ── */
  .measure { text-align: center; padding: 4px 0 0; }
  .measure output { font-size: 44px; font-variant-numeric: tabular-nums; display: block; }
  .measure output span { font-size: 16px; color: var(--muted); }
  input[type=range] { width: 100%; margin: 10px 0 2px; accent-color: var(--accent); }
  .ruler { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .hit { margin-top: 12px; border: 1px solid var(--ok-line); background: var(--ok-soft); border-radius: 9px; padding: 12px; }
  .hit .big { font-size: 22px; font-variant-numeric: tabular-nums; }
  .hit .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
  .hit .row span:first-child { color: var(--muted); }

  /* общий блок стыковки */
  .toe { border: 1px dashed var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 12px; background: #fff; }
  .toe b { font-weight: 600; }
  .toe .f { font-variant-numeric: tabular-nums; }

  /* нижняя лента вариантов */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: #1c1a17; color: #fff;
    display: flex; gap: 0; padding: 0; z-index: 10;
  }
  .bar button {
    flex: 1; background: none; border: 0; color: #fff; opacity: .55; cursor: pointer;
    font-family: inherit; font-size: 12.5px; padding: 10px 4px 12px; line-height: 1.25;
  }
  .bar button[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 -3px 0 var(--accent); }
  .bar b { display: block; font-size: 13.5px; }
  .src { color: var(--muted); font-size: 11.5px; margin: 14px 0 0; }
  .src a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="protobadge">ПРОТОТИП</span><span id="title"></span></h1>
  <p class="sub" id="subtitle"></p>
  <div id="screen"></div>
  <p class="src">
    Мерки — <a href="https://kateatherley.com/2017/08/10/foot-size-tables/">Kate Atherley, «Custom Socks»</a>,
    мужская таблица, дословно. Размер РФ = длина стопы в сантиметрах, ГОСТ 8541-2014 п. 4.2.3.
    Шкала подписана как шкала обуви, а не как тот, кто носит: на общем EUR мужские и женские мерки
    почти совпадают.
  </p>
</div>

<nav class="bar" id="bar"></nav>

<script>
// ── Данные. Мужская таблица Atherley, дословно. Длины в сантиметрах. ──────────
// foot — длина стопы (мерка живой ноги), sole — готовая длина следа носка,
// circ — обхват стопы. Разница foot − sole и есть свобода по длине.
const ROWS = [
  { us: '6',    eur: null, uk: '5.5',  circ: 23,   foot: 24,   sole: 23   },
  { us: '6.5',  eur: 39,   uk: '6',    circ: 23,   foot: 24,   sole: 23   },
  { us: '7',    eur: 40,   uk: '6.5',  circ: 23.5, foot: 24.5, sole: 23.5 },
  { us: '7.5',  eur: 41,   uk: '7',    circ: 23.5, foot: 25,   sole: 23.5 },
  { us: '8',    eur: null, uk: '7.5',  circ: 24,   foot: 25.5, sole: 24   },
  { us: '8.5',  eur: 42,   uk: '8',    circ: 25,   foot: 26,   sole: 24.5 },
  { us: '9',    eur: 43,   uk: '8.5',  circ: 25,   foot: 26,   sole: 25   },
  { us: '9.5',  eur: null, uk: '9',    circ: 25.5, foot: 26.5, sole: 25.5 },
  { us: '10',   eur: 44,   uk: '9.5',  circ: 26,   foot: 27,   sole: 26   },
  { us: '10.5', eur: null, uk: '10',   circ: 26,   foot: 27.5, sole: 26   },
  { us: '11',   eur: 45,   uk: '10.5', circ: 26.5, foot: 28,   sole: 26.5 },
  { us: '11.5', eur: null, uk: '11',   circ: 26.5, foot: 28.5, sole: 27   },
  { us: '12',   eur: 46,   uk: '11.5', circ: 27.5, foot: 29,   sole: 27.5 },
  { us: '12.5', eur: 47,   uk: '12',   circ: 28,   foot: 29,   sole: 28   },
  { us: '13',   eur: null, uk: '12.5', circ: 28,   foot: 29.5, sole: 28.5 },
  { us: '13.5', eur: 48,   uk: '13',   circ: 28.5, foot: 30,   sole: 29   },
];

// Мужской ряд размеров по ГОСТ 8541-94 / 8541-2014.
const GOST_MEN = [23, 25, 27, 29, 31, 33];

// АРИФМЕТИКА ПРОТОТИПА, не цитата: ближайший номер ряда, на равном расстоянии — больший.
const gostSize = (foot) =>
  GOST_MEN.reduce((best, n) => Math.abs(n - foot) <= Math.abs(best - foot) ? n : best);

const num = (v) => v === null ? '—' : String(v).replace('.', ',');

// Что из мерок уезжает в калькулятор мыска. Доля 0,20 — decrease-rhythms.md §5.
const half = (v) => Math.round(v * 2) / 2;

const toeBlock = (sel) => {
  const toe = half(sel.foot * 0.2);
  return `
  <div class="toe">
    <b>Что уедет в мысок.</b>
    Вязать след до <span class="f">${num(sel.sole)}</span> см — это мерка стопы
    <span class="f">${num(sel.foot)}</span> см минус свобода по длине.
    Мысок займёт примерно <span class="f">${num(toe)}</span> см: убавки начинают,
    когда от пятки связано <span class="f">${num(half(sel.sole - toe))}</span> см,
    то есть за <span class="f">${num(toe)}</span> см до конца следа.
    <p class="note">Число рядов мыска отсюда не берётся: для него нужна плотность по рядам,
    а поля плотности в калькуляторе пока нет. Начальные петли тоже не отсюда — они из обхвата.</p>
  </div>`;
};

// ── A. Справочник ─────────────────────────────────────────────────────────────
function screenA() {
  const body = ROWS.map((r) => `
    <tr>
      <td>${num(r.us)}</td>
      <td>${num(r.eur)}</td>
      <td>${num(r.uk)}</td>
      <td class="spine">${gostSize(r.foot)}</td>
      <td class="spine">${num(r.foot)}</td>
      <td>${num(r.sole)}</td>
      <td class="dim">${num(r.circ)}</td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="scroller">
        <table>
          <thead><tr>
            <th>US<br>муж.</th><th>EUR</th><th>UK</th>
            <th class="spine">Размер<br>РФ</th>
            <th class="spine">Длина<br>стопы</th>
            <th>Длина<br>следа</th>
            <th class="dim">Обхват<br>стопы</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <p class="note">Все длины в сантиметрах. <b>Длина стопы</b> — мерка живой ноги,
      <b>длина следа</b> — сколько связать от мыска до середины пятки: она на 1–2 см меньше,
      и это не опечатка, а свобода облегания по длине. Обхват приглушён намеренно:
      ведущая величина здесь — длина.</p>
      <p class="note">Столбец «Размер РФ» — арифметика прототипа: ближайший номер мужского ряда
      ГОСТ (23, 25, 27, 29, 31, 33), на равном расстоянии берётся больший.</p>
    </div>`;
}

// ── B. Размер → мерки ─────────────────────────────────────────────────────────
let scale = 'eur';
let pickedIndex = 8;  // строка Atherley для обувных шкал: US 10 / EUR 44
let pickedGost = 27;  // размер РФ, он же длина стопы в сантиметрах

// Размеры РФ, которые покрывает мужская таблица.
const GOST_IN_RANGE = GOST_MEN.filter((n) =>
  n >= gostSize(ROWS[0].foot) && n <= gostSize(ROWS[ROWS.length - 1].foot));

// Выбранное — не всегда строка таблицы. На шкале РФ длина стопы известна
// из самого размера, а из строки берётся только длина следа.
function selection() {
  if (scale !== 'gost') {
    const r = ROWS[pickedIndex];
    return { foot: r.foot, sole: r.sole, circ: r.circ, src: r, exact: true };
  }
  const src = nearestRow(pickedGost);
  return { foot: pickedGost, sole: src.sole, circ: src.circ, src, exact: src.foot === pickedGost };
}

function screenB() {
  const labels = { us: 'US муж.', eur: 'EUR', uk: 'UK', gost: 'Размер РФ' };
  const chips = scale === 'gost'
    ? GOST_IN_RANGE.map((n) => `
        <button data-gost="${n}" aria-pressed="${n === pickedGost}">${n}</button>`).join('')
    : ROWS.map((r, i) => ({ r, i })).filter(({ r }) => r[scale] !== null).map(({ r, i }) => `
        <button data-index="${i}" aria-pressed="${i === pickedIndex}">${num(r[scale])}</button>`).join('');

  const sel = selection();
  const picked = scale === 'gost' ? pickedGost : ROWS[pickedIndex][scale];
  return `
    <div class="card">
      <div class="scalebar">
        ${Object.entries(labels).map(([k, v]) =>
          `<button data-scale="${k}" aria-pressed="${k === scale}">${v}</button>`).join('')}
      </div>
      <div class="chips">${chips}</div>
      <div class="readout">
        <div class="lead">
          <div class="lab">Длина стопы</div>
          <div class="val">${num(sel.foot)} <span>см</span></div>
        </div>
        <div class="lead">
          <div class="lab">Вязать след до</div>
          <div class="val">${num(sel.sole)} <span>см</span></div>
        </div>
      </div>
      <p class="note">Выбран размер <b>${labels[scale]} ${num(picked)}</b>.
      ${scale === 'gost'
        ? `Длину стопы здесь не ищут по таблице: размер РФ <b>и есть</b> длина стопы в сантиметрах.
           Длина следа взята из ближайшей строки Atherley${sel.exact ? '' : ` (длина стопы ${num(sel.src.foot)} см)`}.`
        : `Обхват стопы для этой строки — ${num(sel.circ)} см, он в этом варианте намеренно не на виду.`}</p>
      ${toeBlock(sel)}
    </div>`;
}

// ── C. Мерка → размер ─────────────────────────────────────────────────────────
let measured = 26.5;

function nearestRow(cm) {
  return ROWS.reduce((best, r) =>
    Math.abs(r.foot - cm) < Math.abs(best.foot - cm) ? r : best);
}

function screenC() {
  const row = nearestRow(measured);
  const off = Math.round((measured - row.foot) * 10) / 10;
  const drift = off === 0
    ? 'ровно в строку'
    : `${off > 0 ? '+' : '−'}${num(Math.abs(off))} см от строки`;
  return `
    <div class="card">
      <div class="measure">
        <div class="lab" style="color:var(--muted);font-size:12.5px">Длина стопы по линейке</div>
        <output>${num(measured)} <span>см</span></output>
        <input type="range" id="slider" min="23" max="31" step="0.5" value="${measured}">
        <div class="ruler"><span>23</span><span>27</span><span>31</span></div>
      </div>
      <div class="hit">
        <div class="big">Размер РФ ${gostSize(measured)}${row.eur ? ' · EUR ' + row.eur : ''} · US ${num(row.us)}</div>
        <div class="row"><span>Ближайшая строка таблицы</span><span>${num(row.foot)} см, ${drift}</span></div>
        <div class="row"><span>Вязать след до</span><span><b>${num(row.sole)} см</b></span></div>
      </div>
      <p class="note">Этот ход — основной, когда стопа под рукой: мерка точнее любого номера.
      Размер здесь показан не чтобы по нему вязать, а чтобы было чем назвать результат.
      Обувные строки идут через 0,5 см, поэтому мерка почти всегда ляжет между ними —
      расхождение показано честно, а не подогнано. EUR показан не у каждой строки:
      в источнике половина строк US его не имеет вовсе, и выдумывать пропуск нечем.</p>
      ${toeBlock({ foot: measured, sole: row.sole })}
    </div>`;
}

// ── Каркас ────────────────────────────────────────────────────────────────────
const VARIANTS = [
  { key: 'A', name: 'Справочник', hint: 'все строки сразу',
    title: 'Справочник размеров', sub: 'Роль первая: самостоятельный инструмент. Читается глазами, ничего не спрашивает.',
    render: screenA },
  { key: 'B', name: 'Размер → мерки', hint: 'знаешь номер',
    title: 'От размера к меркам', sub: 'Роль вторая: подстройка мыска. Знаешь обувной номер — получаешь, до какой длины вязать.',
    render: screenB },
  { key: 'C', name: 'Мерка → размер', hint: 'померил стопу',
    title: 'От мерки к размеру', sub: 'Тот же ход наоборот: стопа померена линейкой, номер нужен только чтобы назвать результат.',
    render: screenC },
];

let current = 0;

function paint() {
  const v = VARIANTS[current];
  document.getElementById('title').textContent = v.title;
  document.getElementById('subtitle').textContent = v.sub;
  document.getElementById('screen').innerHTML = v.render();
  document.getElementById('bar').innerHTML = VARIANTS.map((x, i) =>
    `<button data-variant="${i}" aria-pressed="${i === current}"><b>${x.key} · ${x.name}</b>${x.hint}</button>`).join('');
  if (location.hash.slice(1).toUpperCase() !== v.key) history.replaceState(null, '', '#' + v.key);
}

document.addEventListener('click', (e) => {
  const bar = e.target.closest('[data-variant]');
  if (bar) { current = +bar.dataset.variant; paint(); return; }
  const sc = e.target.closest('[data-scale]');
  if (sc) { scale = sc.dataset.scale; paint(); return; }
  const chip = e.target.closest('[data-index]');
  if (chip) { pickedIndex = +chip.dataset.index; paint(); return; }
  const gost = e.target.closest('[data-gost]');
  if (gost) { pickedGost = +gost.dataset.gost; paint(); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'slider') { measured = +e.target.value; paint(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { current = (current + 1) % VARIANTS.length; paint(); }
  if (e.key === 'ArrowLeft') { current = (current + VARIANTS.length - 1) % VARIANTS.length; paint(); }
});

function fromHash() {
  const i = VARIANTS.findIndex((v) => v.key === location.hash.slice(1).toUpperCase());
  if (i >= 0 && i !== current) { current = i; paint(); }
}

window.addEventListener('hashchange', fromHash);
fromHash();
paint();
</script>
</body>
</html>
