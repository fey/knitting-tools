<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОТОТИП — набор петель по размеру</title>
<!--
  ПРОТОТИП. Одноразовый код, отвечающий на один вопрос.
  Исследование: ../research/cast-on-by-yarn.md (дальше «research»).
  Сосед: ./size-table.html — табличка размеров, вердикт по нему уже вынесен.

  Вопрос: как показать «пара EU → начальные петли» под разную толщину пряжи,
  если источники по одной клетке расходятся? Opal и Regia на 400 м/100 г
  отличаются на ступень в половине размеров, формула с 10 % свободы выше обоих
  на 4–8 петель (research §4.1). Варианты расходятся по открытым вопросам research:
    A — справочник: все пары EU, три источника рядом (вопрос 1 «обе рядом»)
    B — подбор: одна пара, ступени по 4 петли и метки источников на них
        (вопрос 1 «одно число, и мастер видит, чьё»)
    C — своя плотность: поле п./10 см и свобода по рисунку, колонка
        пересчитывается формулой, как у Ann Budd (вопросы 3 и 5)

  Переключение — #A … #C, лента внизу, стрелки ←/→.

  ВЕРДИКТ МАСТЕРА (2026-10-23): берётся A, B и C не берутся.
  Справочник встал на витрину разделом «Справочники», страница `/sock-cast-on/`
  (src/references/cast-on/). Три источника рядом, выбор толщины переключателем.
  Метки источников на ступенях (B) и своя плотность (C) остаются в файле как
  отвергнутые: прототип одноразовый, след отказа полезнее чистого файла.

  ДАННЫЕ ИСТОЧНИКА, НЕ ПРЕДМЕТ ОЦЕНКИ:
  - Числа Opal и Regia — research §5.1, переписаны дословно, не пересчитываются.
  - Длина стопы (ГОСТ 11373-88 и «общая длина» производителя), «носок РФ»,
    обхват Atherley — там же. Обхват берётся серединой диапазона, как в research.
  - Формула — research §3: обхват × (1 − свобода) × плотность / 10, затем
    ближайшее кратное 4. Самопроверка внизу скрипта сверяет код со всеми «→ N»
    из §5.1 и с таблицей чувствительности Alize; разойдётся — красная плашка.

  ДОПУЩЕНИЯ ПРОТОТИПА, НЕ РЕШЕНИЯ:
  - Плотность Alize (30 и 20 п.) — допущение research §2.6, у Alize её нет.
    На экране это сказано прямо, не только здесь.
  - Только взрослые пары 32/33 … 46/47: для детских нет формулы (research §5.1).
  - Ссылка в калькулятор мыска несёт начальные петли из таблицы, а конечные
    подставлены правилом прототипа «≈ треть набора, кратно 4». Это не
    рекомендация, а способ дать рабочую ссылку.
-->
<style>
  :root {
    --bg: #fbfaf8; --fg: #1c1a17; --muted: #6f6a62; --line: #e2ddd5;
    --accent: #b4472a; --accent-soft: #f4ded6; --plain: #ece8e1;
    --card: #ffffff; --ok: #3c5230; --ok-soft: #eef3ea; --ok-line: #c3d4b8;
    --opal: #2f5d8a; --regia: #8a5a2f; --calc: #b4472a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 86px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 0; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .protobadge {
    display: inline-block; background: #1c1a17; color: #fff; font-size: 11px;
    letter-spacing: .08em; padding: 2px 7px; border-radius: 3px; vertical-align: 3px;
    margin-right: 6px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin: 0 0 12px;
  }
  .note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .warn {
    background: #fff4e0; border: 1px solid #e8c98f; color: #6b4a12; border-radius: 7px;
    font-size: 12.5px; padding: 6px 9px; margin: 8px 0 0;
  }
  .fail { background: #b4472a; color: #fff; padding: 8px 12px; border-radius: 7px; margin: 0 0 12px; font-size: 13px; }

  /* выбор пряжи — общий для всех вариантов */
  .yarns { display: flex; gap: 6px; margin: 0 0 10px; }
  .yarns button {
    flex: 1; padding: 7px 4px; font-size: 13px; font-family: inherit; line-height: 1.25;
    border: 1px solid var(--line); background: var(--card); border-radius: 7px; cursor: pointer;
  }
  .yarns button small { display: block; font-size: 11px; color: var(--muted); }
  .yarns button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
  .yarns button[aria-pressed="true"] small { color: #d8d3cb; }
  .brands { font-size: 12.5px; color: var(--muted); margin: -2px 0 10px; }

  /* ── A: справочник ── */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 4px; text-align: right; font-size: 14px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    font-size: 11.5px; font-weight: 600; color: var(--muted); line-height: 1.25;
    border-bottom: 2px solid var(--line); vertical-align: bottom;
  }
  .dim { color: var(--muted); font-size: 12px; display: block; line-height: 1.2; }
  td.eu { font-weight: 600; }
  td.calc { font-weight: 700; color: var(--calc); }
  td.agree { background: var(--ok-soft); }
  th.opal { color: var(--opal); } th.regia { color: var(--regia); } th.calc { color: var(--calc); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

  /* ── B: подбор ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    min-width: 62px; padding: 9px 8px; font-size: 14px; font-family: inherit;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); background: var(--card); border-radius: 7px; cursor: pointer;
  }
  .chips button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips button[aria-pressed="true"] .dim { color: #f4ded6; }
  .lab { font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .steps { display: flex; gap: 6px; margin-top: 4px; }
  .step {
    flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 8px 2px 6px; text-align: center;
    background: var(--card); cursor: pointer; font-family: inherit; color: inherit;
  }
  .step .n { font-size: 22px; font-variant-numeric: tabular-nums; display: block; line-height: 1.2; }
  .step .who { display: flex; flex-direction: column; gap: 2px; min-height: 48px; margin-top: 4px; }
  .step .who span { font-size: 10.5px; border-radius: 3px; padding: 0 3px; color: #fff; }
  .step .fit { font-size: 10.5px; color: var(--muted); display: block; margin-top: 2px; }
  .step[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
  .pin-opal { background: var(--opal); } .pin-regia { background: var(--regia); } .pin-calc { background: var(--calc); }
  .big { font-size: 40px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big span { font-size: 15px; color: var(--muted); }
  .facts { font-size: 13px; margin-top: 10px; }
  .facts div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .facts span:first-child { color: var(--muted); }
  .go {
    display: block; text-align: center; margin-top: 12px; padding: 10px; border-radius: 8px;
    background: var(--fg); color: #fff; text-decoration: none; font-size: 14px;
  }

  /* ── C: своя плотность ── */
  .gauge { display: flex; align-items: center; gap: 10px; }
  .gauge input {
    width: 84px; font: inherit; font-size: 22px; padding: 6px 8px; text-align: center;
    border: 1px solid var(--line); border-radius: 7px; font-variant-numeric: tabular-nums;
  }
  .gauge .u { color: var(--muted); font-size: 13px; line-height: 1.3; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .presets button {
    font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--plain);
  }
  .bar-cell { position: relative; }
  .exact { color: var(--muted); font-size: 12px; }
  .delta { font-size: 11.5px; color: var(--muted); }

  /* нижняя лента вариантов */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: #1c1a17; color: #fff;
    display: flex; gap: 0; padding: 0; z-index: 10;
  }
  .bar button {
    flex: 1; background: none; border: 0; color: #fff; opacity: .55; cursor: pointer;
    font-family: inherit; font-size: 12.5px; padding: 10px 4px 12px; line-height: 1.25;
  }
  .bar button[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 -3px 0 var(--accent); }
  .bar b { display: block; font-size: 13.5px; }
  .src { color: var(--muted); font-size: 11.5px; margin: 14px 0 0; }
  .src a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="protobadge">ПРОТОТИП</span><span id="title"></span></h1>
  <p class="sub" id="subtitle"></p>
  <div id="selfcheck"></div>
  <div id="screen"></div>
  <p class="src">
    Наборы — <a href="https://www.sockenwolle.de/opal-strickwelt/masstabellen/">Opal, «Maßtabellen»</a>
    и <a href="https://www.rainbowsilks.co.uk/documents/Regia%20Sock%20Pattern.pdf">Regia, Sock Guide R0333</a>,
    дословно. Обхват стопы и 10 % свободы — <a href="https://kateatherley.com/2017/08/10/foot-size-tables/">Kate
    Atherley</a>. Длина стопы — ГОСТ 11373-88 и «общая длина стопы» производителя; «носок» — номер
    по ГОСТ 8541-2014. Формула и округление до кратного 4 — расчёт research §3.
  </p>
</div>

<nav class="bar" id="bar"></nav>

<script>
// ── Данные. research §5.1, дословно. ─────────────────────────────────────────
// gost — диапазон длины стопы по ГОСТ, mfr — «общая длина стопы» Opal/Regia,
// sock — номер носка РФ, circ — обхват Atherley [от, до], см.
const PAIRS = [
  { eu: '32/33', gost: '21',        mfr: 21,   sock: 21, circ: [19.5, 20.25] },
  { eu: '34/35', gost: '21,5–22,5', mfr: 22,   sock: 23, circ: [20.25, 21] },
  { eu: '36/37', gost: '23–23,5',   mfr: 23.5, sock: 23, circ: [22.5, 23] },
  { eu: '38/39', gost: '24,5–25',   mfr: 25,   sock: 25, circ: [23.5, 24] },
  { eu: '40/41', gost: '25,5–26,5', mfr: 26.5, sock: 27, circ: [25, 25.5] },
  { eu: '42/43', gost: '27–27,5',   mfr: 27.5, sock: 27, circ: [26, 26] },
  { eu: '44/45', gost: '28,5–29',   mfr: 28.5, sock: 29, circ: [26.5, 26.5] },
  { eu: '46/47', gost: '29,5–30,5', mfr: 30,   sock: 31, circ: [28.5, 28.5] },
];

// Толщины. opal/regia — наборы из таблиц производителя по парам выше.
// gauge — плотность формулы (research §5.1, «Плотности»).
const YARNS = [
  { key: '400', name: '400 м/100 г', tag: 'fingering, 4-ply', gauge: 30,
    brands: 'Opal 4-fach (30 п.), Regia 4-ply (30 п.), Alize Superwash Comfort / Artisan',
    alize: 'У Alize Superwash плотности на этикетке нет: формула считает её по 30 п., как у Opal и Regia. Спицы 2–4 допускают 28–32 п. — это ступень в любую сторону.',
    opal:  [52, 56, 56, 60, 60, 64, 64, 68], opalGauge: 30,
    regia: [56, 56, 60, 60, 64, 64, 68, 72], regiaGauge: 30 },
  { key: '200', name: '200 м/100 г', tag: 'DK / sport, 8-ply', gauge: 20,
    brands: 'Opal 8-fach (20 п.), Regia 8-ply (20 п.), Alize Wooltime',
    alize: 'У Alize Wooltime плотности на этикетке нет: формула считает её по 20 п., как у Opal и Regia.',
    opal:  [40, 40, 44, 44, 48, 48, 52, 52], opalGauge: 20,
    regia: [40, 40, 44, 44, 48, 48, 52, 52], regiaGauge: 20 },
  { key: '250', name: '250–280 м', tag: '6-ply', gauge: 22,
    brands: 'Opal 6-fach (23 п., 280 м/100 г), Regia 6-ply (22 п., 250 м/100 г)',
    alize: null,
    opal:  [44, 48, 48, 52, 52, 56, 56, 56], opalGauge: 23,
    regia: [44, 44, 48, 48, 52, 52, 56, 56], regiaGauge: 22 },
];

// ── Формула research §3 ──────────────────────────────────────────────────────
const circOf = (p) => (p.circ[0] + p.circ[1]) / 2;
const exactOf = (p, gauge, ease) => circOf(p) * (1 - ease) * gauge / 10;
const by4 = (x) => Math.round(x / 4) * 4;
const castOn = (p, gauge, ease = 0.1) => by4(exactOf(p, gauge, ease));

const num = (x, d = 1) => String(Math.round(x * 10 ** d) / 10 ** d).replace('.', ',');
const circText = (p) => p.circ[0] === p.circ[1] ? num(p.circ[0], 2) : `${num(p.circ[0], 2)}–${num(p.circ[1], 2)}`;
// Сколько процентов свободы на самом деле даёт число таблицы — research §4.1.
const easeOf = (p, sts, gauge) => Math.round((1 - (sts / gauge * 10) / circOf(p)) * 100);
// Конечные петли для ссылки в калькулятор — правило прототипа, см. шапку.
const toeLink = (s) => `https://fey.github.io/knitting-tools/toe-band/#s=${s}&e=${4 * Math.round(s / 12)}&k=1&r=even`;

// ── Состояние ────────────────────────────────────────────────────────────────
let current = 0;
let yarn = 0;
let pair = 3;          // 38/39
let picked = null;     // выбранная ступень в B; null — по умолчанию формула
let myGauge = 30;
let ease = 0.1;

function yarnBar() {
  return `<div class="yarns">${YARNS.map((y, i) =>
    `<button data-yarn="${i}" aria-pressed="${i === yarn}">${y.name}<small>${y.tag}</small></button>`).join('')}</div>
    <div class="brands">${YARNS[yarn].brands}</div>`;
}

// ── A: справочник ────────────────────────────────────────────────────────────
function screenA() {
  const y = YARNS[yarn];
  const same = y.opal.every((v, i) => v === y.regia[i]);
  const rows = PAIRS.map((p, i) => {
    const f = castOn(p, y.gauge);
    const o = y.opal[i], r = y.regia[i];
    const cls = (v) => v === f ? ' agree' : '';
    const mfr = same
      ? `<td class="${cls(o).trim()}">${o}</td>`
      : `<td class="${cls(o).trim()}">${o}</td><td class="${cls(r).trim()}">${r}</td>`;
    return `<tr>
      <td class="eu">${p.eu}<span class="dim">носок ${p.sock}</span></td>
      <td>${num(p.mfr)}<span class="dim">${p.gost}</span></td>
      ${mfr}
      <td class="calc">${f}</td></tr>`;
  }).join('');
  const head = same
    ? `<th class="opal">Opal = Regia</th>`
    : `<th class="opal">Opal</th><th class="regia">Regia</th>`;
  return `
    <div class="card">
      ${yarnBar()}
      <table>
        <thead><tr><th>Пара EU</th><th>Стопа, см<span class="dim">по ГОСТ</span></th>${head}<th class="calc">Формула<span class="dim">${y.gauge} п., 10 %</span></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="legend">
        <span><i style="background:var(--ok-soft);border:1px solid var(--ok-line)"></i>совпало с формулой</span>
        <span>числа — начальные петли, кратно 4</span>
      </div>
      ${y.alize ? `<p class="warn">${y.alize}</p>` : ''}
      <p class="note">Все три числа рядом, выбор за мастером. Opal и Regia — «Richtwerte», ориентир;
      формула — обхват стопы минус 10 % свободы на чулочную гладь. На 400 м/100 г таблицы
      производителей облегают туже формулы на ступень-две: от 25 см стопы свобода у них 14–21 %.</p>
    </div>`;
}

// ── B: подбор ────────────────────────────────────────────────────────────────
function screenB() {
  const y = YARNS[yarn];
  const p = PAIRS[pair];
  const f = castOn(p, y.gauge);
  const o = y.opal[pair], r = y.regia[pair];
  const vals = [f, o, r];
  const lo = Math.min(...vals) - 4, hi = Math.max(...vals) + 4;
  const steps = [];
  for (let s = lo; s <= hi; s += 4) steps.push(s);
  const chosen = picked != null && steps.includes(picked) ? picked : f;
  const stepHtml = steps.map((s) => {
    const who = [
      o === s && r === s ? `<span class="pin-opal">Opal · Regia</span>` : '',
      o === s && r !== s ? `<span class="pin-opal">Opal</span>` : '',
      r === s && o !== s ? `<span class="pin-regia">Regia</span>` : '',
      f === s ? `<span class="pin-calc">формула</span>` : '',
    ].join('');
    return `<button class="step" data-step="${s}" aria-pressed="${s === chosen}">
      <span class="n">${s}</span>
      <span class="fit">${easeOf(p, s, y.gauge)} %</span>
      <span class="who">${who}</span></button>`;
  }).join('');
  return `
    <div class="card">
      ${yarnBar()}
      <div class="lab">Пара EU</div>
      <div class="chips">${PAIRS.map((q, i) =>
        `<button data-pair="${i}" aria-pressed="${i === pair}">${q.eu}</button>`).join('')}</div>

      <div class="lab">Начальные петли — ступени по 4. Под числом — насколько носок уже стопы</div>
      <div class="steps">${stepHtml}</div>

      <div style="margin-top:14px">
        <div class="big">${chosen} <span>начальных петель</span></div>
        <div class="facts">
          <div><span>Длина стопы</span><span>${p.gost} см по ГОСТ · носок ${p.sock}</span></div>
          <div><span>Обхват стопы (Atherley)</span><span>${circText(p)} см</span></div>
          <div><span>Готовый обхват при ${y.gauge} п.</span><span>${num(chosen / y.gauge * 10)} см</span></div>
          <div><span>На пятку</span><span>${chosen / 2} петель</span></div>
        </div>
      </div>
      ${y.alize ? `<p class="warn">${y.alize}</p>` : ''}
      <a class="go" href="${toeLink(chosen)}" target="_blank">В калькулятор мыска: ${chosen} начальных петель →</a>
      <p class="note">Одно число крупно, а откуда оно — метками на ступенях. Ступени соседние,
      потому что разница между источниками — всегда 4 или 8 петель, то есть «туже» или «свободнее»,
      а не другой носок. Процент — расчёт research §4.1 при плотности ${y.gauge} п.</p>
    </div>`;
}

// ── C: своя плотность ────────────────────────────────────────────────────────
const EASES = [
  { v: 0, name: '0 %', hint: 'жаккард' },
  { v: 0.05, name: '5 %', hint: 'косы' },
  { v: 0.1, name: '10 %', hint: 'гладь' },
  { v: 0.15, name: '15 %', hint: 'ажур' },
];
const GAUGE_PRESETS = [
  { g: 30, name: 'Opal / Regia 4 · 30' },
  { g: 28, name: 'Lana Grossa · 28' },
  { g: 23, name: 'Opal 6 · 23' },
  { g: 22, name: 'Regia 6 · 22' },
  { g: 20, name: 'Opal / Regia 8 · 20' },
];

function screenC() {
  const g = myGauge;
  const ok = g >= 10 && g <= 45;
  // Таблица производителя показывается, только если плотность совпала с её собственной.
  const match = YARNS.flatMap((y) => [
    y.opalGauge === g ? { who: 'Opal', y, vals: y.opal } : null,
    y.regiaGauge === g ? { who: 'Regia', y, vals: y.regia } : null,
  ]).filter(Boolean);
  const rows = ok ? PAIRS.map((p, i) => {
    const x = exactOf(p, g, ease);
    const s = by4(x);
    const cmp = match.map((m) => {
      const d = m.vals[i] - s;
      return `<span class="delta">${m.who} ${m.vals[i]}${d ? ` (${d > 0 ? '+' : '−'}${Math.abs(d)})` : ''}</span>`;
    }).join('<br>');
    return `<tr>
      <td class="eu">${p.eu}<span class="dim">носок ${p.sock}</span></td>
      <td>${circText(p)}</td>
      <td class="exact">${num(x)}</td>
      <td class="calc">${s}</td>
      ${match.length ? `<td>${cmp}</td>` : ''}</tr>`;
  }).join('') : '';
  return `
    <div class="card">
      <div class="lab" style="margin-top:0">Плотность по своему образцу</div>
      <div class="gauge">
        <input id="gauge" type="number" inputmode="decimal" min="10" max="45" step="1" value="${g}">
        <div class="u">петель на 10 см<br>чулочной гладью</div>
      </div>
      <div class="presets">${GAUGE_PRESETS.map((x) => `<button data-gauge="${x.g}">${x.name}</button>`).join('')}</div>

      <div class="lab">Свобода — насколько носок уже стопы (Atherley)</div>
      <div class="chips">${EASES.map((e) =>
        `<button data-ease="${e.v}" aria-pressed="${e.v === ease}">${e.name}<span class="dim">${e.hint}</span></button>`).join('')}</div>

      ${ok ? `
      <table style="margin-top:12px">
        <thead><tr><th>Пара EU</th><th>Обхват, см</th><th>Точно</th><th class="calc">Набор</th>${match.length ? '<th>Таблица</th>' : ''}</tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<p class="warn">Плотность — от 10 до 45 петель на 10 см.</p>`}
      <p class="note">Ни одной марки: колонку задаёт образец. Число производителя появляется сбоку,
      только когда плотность совпала с его таблицей, — иначе сравнивать не с чем. ±2 петли плотности
      сдвигают набор на 4–8 петель (research §5.1, чувствительность Alize).</p>
    </div>`;
}

// ── Каркас ────────────────────────────────────────────────────────────────────
const VARIANTS = [
  { key: 'A', name: 'Справочник', hint: 'все пары, три источника',
    title: 'Набор петель: справочник', sub: 'Все пары EU разом. Числа Opal, Regia и формулы стоят рядом, выбор — за мастером.',
    render: screenA },
  { key: 'B', name: 'Подбор', hint: 'одна пара, ступени',
    title: 'Набор петель на мой размер', sub: 'Пара EU и пряжа → одно число крупно. Чьё оно — видно по меткам на ступенях.',
    render: screenB },
  { key: 'C', name: 'Своя плотность', hint: 'образец и рисунок',
    title: 'Набор петель по образцу', sub: 'Плотность своего образца и рисунок → колонка на все пары. Марки не нужны.',
    render: screenC },
];

function paint() {
  const v = VARIANTS[current];
  document.getElementById('title').textContent = v.title;
  document.getElementById('subtitle').textContent = v.sub;
  document.getElementById('screen').innerHTML = v.render();
  document.getElementById('bar').innerHTML = VARIANTS.map((x, i) =>
    `<button data-variant="${i}" aria-pressed="${i === current}"><b>${x.key} · ${x.name}</b>${x.hint}</button>`).join('');
  if (location.hash.slice(1).toUpperCase() !== v.key) history.replaceState(null, '', '#' + v.key);
}

document.addEventListener('click', (e) => {
  const t = (sel) => e.target.closest(sel);
  let el;
  if ((el = t('[data-variant]'))) { current = +el.dataset.variant; paint(); return; }
  if ((el = t('[data-yarn]'))) { yarn = +el.dataset.yarn; picked = null; paint(); return; }
  if ((el = t('[data-pair]'))) { pair = +el.dataset.pair; picked = null; paint(); return; }
  if ((el = t('[data-step]'))) { picked = +el.dataset.step; paint(); return; }
  if ((el = t('[data-ease]'))) { ease = +el.dataset.ease; paint(); return; }
  if ((el = t('[data-gauge]'))) { myGauge = +el.dataset.gauge; paint(); }
});

// Поле плотности перерисовывается без потери фокуса: заменяется только таблица.
document.addEventListener('input', (e) => {
  if (e.target.id !== 'gauge') return;
  myGauge = +String(e.target.value).replace(',', '.');
  const pos = e.target.selectionStart;
  paint();
  const input = document.getElementById('gauge');
  input.focus();
  try { input.setSelectionRange(pos, pos); } catch { /* type=number не держит выделение */ }
});

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowRight') { current = (current + 1) % VARIANTS.length; paint(); }
  if (e.key === 'ArrowLeft') { current = (current + VARIANTS.length - 1) % VARIANTS.length; paint(); }
});

function fromHash() {
  const i = VARIANTS.findIndex((v) => v.key === location.hash.slice(1).toUpperCase());
  if (i >= 0 && i !== current) { current = i; paint(); }
}

// ── Самопроверка: код против research §5.1 ───────────────────────────────────
(function selfcheck() {
  const expect = {
    30: [52, 56, 60, 64, 68, 72, 72, 76],      // 400 м, формула
    20: [36, 36, 40, 44, 44, 48, 48, 52],      // 200 м, формула
    22: [40, 40, 44, 48, 48, 52, 52, 56],      // 250–280 м, формула
    28: [52, 52, 56, 60, 64, 64, 68, 72],      // чувствительность Alize
    32: [56, 60, 64, 68, 72, 76, 76, 84],
    18: [32, 32, 36, 40, 40, 44, 44, 48],
  };
  const bad = [];
  for (const [g, vals] of Object.entries(expect)) {
    PAIRS.forEach((p, i) => { const got = castOn(p, +g); if (got !== vals[i]) bad.push(`${p.eu} при ${g} п.: ${got}, а в research ${vals[i]}`); });
  }
  if (bad.length) document.getElementById('selfcheck').innerHTML =
    `<div class="fail">Формула разошлась с research §5.1: ${bad.join('; ')}</div>`;
})();

window.addEventListener('hashchange', fromHash);
fromHash();
paint();
</script>
</body>
