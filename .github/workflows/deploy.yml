# Сборка, тесты и деплой страницы на GitHub Pages.
# На Pages уезжает только выпущенный релиз. Push в main и pull_request останавливаются
# на сборке и тестах, а деплой запускают два пути:
#   - release.yml зовёт этот файл как reusable workflow, когда release-please поставил
#     тег (workflow_call: ref — тег, deploy — true). Тег от GITHUB_TOKEN другие workflow
#     не заводит, поэтому `on: push: tags` не сработало бы, а звать надо напрямую;
#   - workflow_dispatch — запасной путь: передеплоить релиз руками (по умолчанию —
#     последний, либо тег из поля ref).
# Оба пути идут из контекста main (github.ref), поэтому окружение github-pages с политикой
# «только main» их пускает, а собирается при этом код тега — через checkout по ref.
name: Сборка и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Тег релиза, который собрать и выкатить
        type: string
        default: ''
      deploy:
        description: Выкатывать ли собранное на Pages
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Тег релиза для передеплоя; пусто — последний релиз
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Прогон держит очередь своей ветки, а не общую: в общей группе ожидающий прогон
# бывает только один, и PR, открытые подряд, отменяли проверки друг другу.
# Новый push в PR гасит его устаревший прогон; прогоны main не гасятся никогда.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Что собираем и какого Playwright. Ветка и PR собираются как есть (ref пуст —
  # checkout берёт сам событие), релиз — по тегу. Ручной запуск без ref берёт последний
  # релиз. Тег образа Playwright для job'а build читается из lock-файла того же ref,
  # а не пишется руками: браузер в образе собран под ровно ту версию @playwright/test,
  # и стоит им разъехаться — прогон страницы не найдёт свой браузер. Отдельный job нужен
  # потому, что образ выбирается до первого шага, а версию надо прочесть заранее.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      version: ${{ steps.lockfile.outputs.version }}
    steps:
      # Значения идут переменными окружения, а не подстановкой в команду:
      # поле ref вводит человек, и кавычки в нём не должны ломать шелл.
      - id: target
        name: Что собирать
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ] && [ "$EVENT_NAME" = workflow_dispatch ]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}

      # Обёртка вокруг цели — не команда в шаге: версию надо отдать в $GITHUB_OUTPUT,
      # а это делает только шелл.
      - id: lockfile
        name: Версия Playwright из lock-файла
        run: echo "version=$(make -s playwright-version)" >> "$GITHUB_OUTPUT"

  # Сборка идёт в официальном образе Playwright: браузер и его системные пакеты уже
  # в нём. Раньше их ставил `make browsers` через apt на каждом прогоне, и когда
  # зеркало Ubuntu отдавало пакеты по минутам на файл, деплой стоял больше 10 минут
  # (#69). Кэш тут не спасает: Playwright не советует кэшировать браузеры, а apt-пакеты
  # ложатся в систему раннера. `make browsers` остаётся для локальной установки.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.version }}-noble
    steps:
      # make в образе нет, а шаги ниже зовут цели. Это один маленький пакет из apt,
      # а не десятки библиотек браузера — от зеркала прогон зависит куда меньше.
      - name: Установка make
        run: apt-get update && apt-get install -y --no-install-recommends make

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # Мажор тот же, на котором гоняют локально: разойдись раннер с локалью
      # версией ноды — и зелёный прогон здесь перестал бы что-либо обещать там.
      # В образе Playwright своя нода, setup-node ставит нашу поверх неё.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Установка зависимостей
        run: make install

      # Заголовок PR при squash-мерже становится коммитом в main и записью в заметках
      # к релизу (CLAUDE.md, «Коммиты»). Заголовок идёт переменной окружения,
      # а не подстановкой в команду: так кавычки в нём не ломают шелл.
      - name: Заголовок PR
        if: github.event_name == 'pull_request'
        run: make lint-pr-title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Тесты ядра
        run: make test-unit

      # Гоняется только функциональный проект. Скриншотный (test:screens) в CI
      # не запускается намеренно: базлайны сняты на машине мастера, на раннере
      # рендер другой, и первый же push положил бы прогон вместе с деплоем.
      - name: Тесты страницы
        run: make test-e2e

      # Ссылка на форму обратной связи (§11) приезжает секретом: без неё сборка
      # не падает, но страница уезжает без кнопки «Оставить отзыв» — молча.
      # Прогон страницы выше собирает себе dist сам и подставляет заведомо
      # ненастоящую ссылку (playwright.config.ts), к живой форме тесты не ходят.
      - name: Сборка
        run: make build
        env:
          VITE_FEEDBACK_PREFILL_URL: ${{ secrets.VITE_FEEDBACK_PREFILL_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Только релиз: вызов из release.yml с deploy: true или ручной запуск. Push в main
    # и PR сюда не доходят — страница не меняется, пока не выпущен релиз.
    if: inputs.deploy || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Деплои не гоняются параллельно, но и не отменяют друг друга на полпути.
    # Группа стоит на job'е деплоя, а не на всём прогоне: PR до деплоя не доходят.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
