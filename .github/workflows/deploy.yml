# Сборка, тесты и деплой страницы на GitHub Pages.
# По push в main прогон доезжает до деплоя, по pull_request — останавливается на сборке.
name: Сборка и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Прогон держит очередь своей ветки, а не общую: в общей группе ожидающий прогон
# бывает только один, и PR, открытые подряд, отменяли проверки друг другу.
# Новый push в PR гасит его устаревший прогон; прогоны main не гасятся никогда.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Тег образа Playwright для job'а build читается из lock-файла, а не пишется
  # руками: браузер в образе собран под ровно ту версию @playwright/test, и стоит
  # им разъехаться — прогон страницы не найдёт свой браузер. Отдельный job нужен
  # потому, что образ выбирается до первого шага, а версию надо прочесть заранее.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: lockfile
        name: Версия Playwright из lock-файла
        run: echo "version=$(make -s playwright-version)" >> "$GITHUB_OUTPUT"

  # Сборка идёт в официальном образе Playwright: браузер и его системные пакеты уже
  # в нём. Раньше их ставил `make browsers` через apt на каждом прогоне, и когда
  # зеркало Ubuntu отдавало пакеты по минутам на файл, деплой стоял больше 10 минут
  # (#69). Кэш тут не спасает: Playwright не советует кэшировать браузеры, а apt-пакеты
  # ложатся в систему раннера. `make browsers` остаётся для локальной установки.
  build:
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      # make в образе нет, а шаги ниже зовут цели. Это один маленький пакет из apt,
      # а не десятки библиотек браузера — от зеркала прогон зависит куда меньше.
      - name: make
        run: apt-get update && apt-get install -y --no-install-recommends make

      - uses: actions/checkout@v7

      # Мажор тот же, на котором гоняют локально: разойдись раннер с локалью
      # версией ноды — и зелёный прогон здесь перестал бы что-либо обещать там.
      # В образе Playwright своя нода, setup-node ставит нашу поверх неё.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Установка зависимостей
        run: make install

      # Заголовок PR при squash-мерже становится коммитом в main и записью в заметках
      # к релизу (CLAUDE.md, «Коммиты»). Заголовок идёт переменной окружения,
      # а не подстановкой в команду: так кавычки в нём не ломают шелл.
      - name: Заголовок PR
        if: github.event_name == 'pull_request'
        run: make lint-pr-title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Тесты ядра
        run: make test-unit

      # Гоняется только функциональный проект. Скриншотный (test:screens) в CI
      # не запускается намеренно: базлайны сняты на машине мастера, на раннере
      # рендер другой, и первый же push положил бы прогон вместе с деплоем.
      - name: Тесты страницы
        run: make test-e2e

      # Ссылка на форму обратной связи (§11) приезжает секретом: без неё сборка
      # не падает, но страница уезжает без кнопки «Оставить отзыв» — молча.
      # Прогон страницы выше собирает себе dist сам и подставляет заведомо
      # ненастоящую ссылку (playwright.config.ts), к живой форме тесты не ходят.
      - name: Сборка
        run: make build
        env:
          VITE_FEEDBACK_PREFILL_URL: ${{ secrets.VITE_FEEDBACK_PREFILL_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Деплои не гоняются параллельно, но и не отменяют друг друга на полпути.
    # Группа стоит на job'е деплоя, а не на всём прогоне: PR до деплоя не доходят.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
