# Релизы из заголовков коммитов (раздел «Коммиты» в CLAUDE.md).
# На каждый push в main release-please держит открытым PR «chore: Релиз X.Y.Z»:
# версия в package.json, CHANGELOG.md, заметки из feat, fix и perf. Мерж этого PR
# ставит тег vX.Y.Z и публикует релиз на GitHub. Деплой живёт отдельно, в deploy.yml.
name: Релиз

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
